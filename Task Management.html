<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aetheria — Quest Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
/* ── TOKENS — Aetheria ──────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
:root {
  --bg-0:        #06060d;
  --bg-1:        #0a0a14;
  --bg-2:        #0f0f1d;
  --bg-3:        #15152a;
  --bg-4:        #1c1c34;
  --surface:     #101022;
  --surface-2:   #15152c;
  --surface-3:   #1c1c38;
  --border:      #2a2a48;
  --border-hi:   #3a3a5e;
  --border-lo:   #1f1f38;

  --gold:        oklch(0.78 0.16 82);
  --gold-2:      oklch(0.68 0.14 82);
  --gold-glow:   oklch(0.78 0.16 82 / 0.35);
  --violet:      oklch(0.68 0.22 295);
  --violet-2:    oklch(0.55 0.20 295);
  --violet-glow: oklch(0.68 0.22 295 / 0.35);
  --cyan:        oklch(0.78 0.16 205);
  --cyan-2:      oklch(0.6 0.14 205);
  --cyan-glow:   oklch(0.78 0.16 205 / 0.35);
  --rose:        oklch(0.74 0.18 5);
  --rose-glow:   oklch(0.74 0.18 5 / 0.35);
  --mint:        oklch(0.76 0.14 162);
  --mint-2:      oklch(0.6 0.12 162);
  --mint-glow:   oklch(0.76 0.14 162 / 0.35);
  --crimson:     oklch(0.62 0.24 22);

  --text-hi:     #f0eeff;
  --text-md:     #b4b4d8;
  --text-lo:     #7676a0;
  --text-dim:    #4a4a6a;

  --f-title:  'Cinzel', serif;
  --f-body:   'Sora', sans-serif;
  --f-mono:   'JetBrains Mono', monospace;

  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 20px;

  --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

body {
  background: var(--bg-0);
  color: var(--text-hi);
  font-family: var(--f-body);
  font-size: 13px;
  background-image:
    radial-gradient(ellipse 70% 50% at 78% 0%,   oklch(0.35 0.18 295 / 0.18) 0%, transparent 60%),
    radial-gradient(ellipse 55% 45% at 0% 70%,   oklch(0.40 0.18 205 / 0.10) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 100% 100%, oklch(0.45 0.18 82 / 0.08) 0%, transparent 60%);
  background-attachment: fixed;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-hi); }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; color: inherit; }

/* ── APP SHELL ──────────────────────────────────────────── */
.app { display: flex; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden; }
.app.focus-mode .navrail,
.app.focus-mode .herorail { opacity: 0.4; transform: translateX(-4px); }
.app.focus-mode .ph-filters,
.app.focus-mode .day-side .timeline-panel { opacity: 0.5; }

.shell {
  flex: 1;
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr) 280px;
  min-height: 0;
  overflow: hidden;
}

/* ── TOPBAR ─────────────────────────────────────────────── */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 18px;
  background: linear-gradient(180deg, var(--bg-1), var(--surface));
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
  z-index: 20;
}
.topbar::after {
  content:'';
  position: absolute;
  inset: 0;
  border-bottom: 1px solid var(--border);
  pointer-events: none;
  background: linear-gradient(90deg, transparent, var(--gold-glow), transparent);
  opacity: 0.06;
}
.brand { display: flex; align-items: center; gap: 10px; padding-right: 14px; border-right: 1px solid var(--border); margin-right: 4px; }
.brand-mark {
  width: 32px; height: 32px;
  border-radius: var(--r-sm);
  background: linear-gradient(135deg, var(--gold), var(--violet));
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: #0a0400;
  box-shadow: 0 0 18px var(--gold-glow), inset 0 0 8px oklch(1 0 0 / 0.25);
}
.brand-name {
  font-family: var(--f-title);
  font-weight: 900;
  letter-spacing: 0.22em;
  font-size: 14px;
  background: linear-gradient(90deg, var(--gold), var(--violet));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.brand-tag {
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.3em;
  color: var(--text-lo);
}
.top-search {
  flex: 1; max-width: 460px;
  display: flex; align-items: center; gap: 10px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 7px 14px;
  transition: all 0.2s var(--ease-out);
}
.top-search:focus-within { border-color: var(--gold); box-shadow: 0 0 0 3px oklch(0.78 0.16 82 / 0.1), 0 0 16px var(--gold-glow); }
.top-search input { background: none; border: none; outline: none; flex: 1; font-size: 12px; }
.top-search input::placeholder { color: var(--text-dim); }
.top-search .search-ico { color: var(--gold); font-size: 14px; }
.top-search .kbd {
  background: var(--bg-3); border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 1px 6px;
  font-family: var(--f-mono);
  font-size: 9px;
  color: var(--text-md);
  letter-spacing: 0.05em;
}
.top-right { display: flex; align-items: center; gap: 10px; }
.focus-pill {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 6px 12px;
  font-family: var(--f-title);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.15em;
  color: var(--text-md);
  transition: all 0.2s;
}
.focus-pill .ico { font-size: 12px; }
.focus-pill:hover { color: var(--text-hi); border-color: var(--border-hi); }
.focus-pill.on {
  background: linear-gradient(135deg, var(--violet-2), var(--violet));
  border-color: var(--violet);
  color: #fff;
  box-shadow: 0 0 16px var(--violet-glow);
}
.currency-pill {
  display: flex; align-items: center; gap: 5px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 12px 5px 10px;
  font-family: var(--f-title);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.05em;
}
.currency-pill .ico { font-size: 13px; }
.currency-pill.gems { border-color: oklch(0.68 0.22 295 / 0.45); color: var(--violet); box-shadow: inset 0 0 12px oklch(0.68 0.22 295 / 0.1); }
.currency-pill.gems .ico { color: var(--violet); }
.currency-pill.coins { border-color: oklch(0.78 0.16 82 / 0.45); color: var(--gold); box-shadow: inset 0 0 12px oklch(0.78 0.16 82 / 0.1); }
.currency-pill.coins .ico { color: var(--gold); }
.streak-pill {
  display: flex; align-items: center; gap: 5px;
  background: linear-gradient(135deg, oklch(0.55 0.18 25 / 0.15), oklch(0.78 0.16 82 / 0.15));
  border: 1px solid oklch(0.78 0.16 82 / 0.4);
  border-radius: 999px;
  padding: 5px 12px;
  font-family: var(--f-title);
  font-size: 11px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.08em;
  box-shadow: 0 0 14px var(--gold-glow);
}
.streak-pill .ico { font-size: 13px; }
.avatar-pip {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--violet-2), var(--gold-2));
  display: flex; align-items: center; justify-content: center;
  font-family: var(--f-title);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.05em;
  border: 1.5px solid var(--gold);
  box-shadow: 0 0 12px var(--gold-glow);
  color: #fff;
}

/* ── NAV RAIL ───────────────────────────────────────────── */
.navrail {
  background: linear-gradient(180deg, var(--bg-1), var(--bg-0));
  border-right: 1px solid var(--border);
  padding: 16px 8px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: opacity 0.3s, transform 0.3s;
}
.nav-stack { display: flex; flex-direction: column; gap: 4px; }
.nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 4px;
  border-radius: var(--r-sm);
  color: var(--text-lo);
  transition: all 0.2s var(--ease-out);
  position: relative;
}
.nav-btn .ico { font-size: 16px; }
.nav-btn .lbl {
  font-family: var(--f-title);
  font-size: 8px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-weight: 600;
}
.nav-btn:hover { background: var(--surface-2); color: var(--text-md); }
.nav-btn.active {
  color: var(--gold);
  background: linear-gradient(135deg, oklch(0.78 0.16 82 / 0.12), oklch(0.78 0.16 82 / 0.02));
  border: 1px solid oklch(0.78 0.16 82 / 0.3);
  box-shadow: 0 0 14px var(--gold-glow), inset 0 0 12px oklch(0.78 0.16 82 / 0.08);
}
.nav-btn.active::before {
  content: '';
  position: absolute;
  left: -8px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 50%;
  background: var(--gold);
  border-radius: 2px;
  box-shadow: 0 0 6px var(--gold-glow);
}

/* ── MAIN ───────────────────────────────────────────────── */
.main {
  padding: 18px 22px 22px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 0;
}

/* ── PAGE HEADER ─────────────────────────────────────────── */
.page-header {
  display: flex;
  flex-wrap: wrap;
  gap: 14px 24px;
  align-items: flex-end;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.ph-left { flex: 1 1 320px; }
.ph-right { flex: 0 0 auto; }
.ph-filters { flex: 1 1 100%; }
.page-header::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: 0.4;
}
.ph-left { min-width: 0; }
.ph-tag {
  font-family: var(--f-title);
  font-size: 10px;
  letter-spacing: 0.35em;
  color: var(--gold);
  margin-bottom: 6px;
}
.ph-title {
  font-family: var(--f-title);
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 0.05em;
  line-height: 1;
  background: linear-gradient(135deg, var(--text-hi) 0%, var(--gold) 55%, var(--violet) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.ph-desc {
  margin-top: 8px;
  color: var(--text-md);
  font-size: 12px;
  line-height: 1.6;
}
.ph-desc .combo {
  font-family: var(--f-title);
  font-weight: 700;
  color: var(--gold);
  margin: 0 4px;
}
.ph-right { display: flex; align-items: center; gap: 10px; }
.view-switch {
  display: flex;
  gap: 0;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 3px;
}
.vs-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 16px;
  font-family: var(--f-title);
  font-size: 10px;
  letter-spacing: 0.18em;
  font-weight: 700;
  color: var(--text-lo);
  border-radius: 6px;
  transition: all 0.18s var(--ease-out);
}
.vs-btn:hover { color: var(--text-md); }
.vs-btn.active {
  background: linear-gradient(135deg, var(--gold-2), var(--gold));
  color: #0a0400;
  box-shadow: 0 0 12px var(--gold-glow), inset 0 0 6px oklch(1 0 0 / 0.2);
}
.ph-filters {
  grid-column: 1 / -1;
  display: flex;
  gap: 24px;
  align-items: center;
  flex-wrap: wrap;
  transition: opacity 0.3s;
}
.filter-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.filter-group.right-align { margin-left: auto; }
.fg-label {
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.25em;
  color: var(--text-dim);
  text-transform: uppercase;
  padding-right: 6px;
}

/* ── CHIPS ──────────────────────────────────────────────── */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--text-md);
  font-family: var(--f-title);
  font-size: 10px;
  letter-spacing: 0.12em;
  font-weight: 600;
  padding: 5px 11px;
  border-radius: 999px;
  transition: all 0.18s;
  text-transform: uppercase;
}
.chip .ci { font-size: 10px; opacity: 0.9; }
.chip:hover { color: var(--text-hi); border-color: var(--border-hi); }
.chip.on { color: var(--text-hi); border-color: currentColor; }
.chip-gold.on   { color: var(--gold);   background: oklch(0.78 0.16 82 / 0.12);  box-shadow: 0 0 10px var(--gold-glow); }
.chip-violet.on { color: var(--violet); background: oklch(0.68 0.22 295 / 0.14); box-shadow: 0 0 10px var(--violet-glow); }
.chip-cyan.on   { color: var(--cyan);   background: oklch(0.78 0.16 205 / 0.12); box-shadow: 0 0 10px var(--cyan-glow); }
.chip-mint.on   { color: var(--mint);   background: oklch(0.76 0.14 162 / 0.12); box-shadow: 0 0 10px var(--mint-glow); }
.chip-rose.on   { color: var(--rose);   background: oklch(0.74 0.18 5 / 0.14);   box-shadow: 0 0 10px var(--rose-glow); }
.rank-chip {
  width: 32px; justify-content: center; padding: 4px 0;
  font-family: var(--f-title);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0;
}
.rank-chip.rk-S.on { background: linear-gradient(135deg, oklch(0.55 0.20 320), oklch(0.7 0.22 320)); color: #fff; border-color: oklch(0.7 0.22 320); box-shadow: 0 0 10px oklch(0.7 0.22 320 / 0.5); }
.rank-chip.rk-A.on { background: linear-gradient(135deg, oklch(0.50 0.20 22), var(--rose)); color: #fff; border-color: var(--rose); box-shadow: 0 0 10px var(--rose-glow); }
.rank-chip.rk-B.on { background: linear-gradient(135deg, var(--violet-2), var(--violet)); color: #fff; border-color: var(--violet); box-shadow: 0 0 10px var(--violet-glow); }
.rank-chip.rk-C.on { background: linear-gradient(135deg, var(--cyan-2), var(--cyan)); color: #021; border-color: var(--cyan); box-shadow: 0 0 10px var(--cyan-glow); }
.rank-chip.rk-D.on { background: var(--bg-3); color: var(--text-md); border-color: var(--border-hi); }

.seg {
  display: inline-flex;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 2px;
}
.seg-btn {
  padding: 5px 12px;
  border-radius: 6px;
  font-family: var(--f-title);
  font-size: 10px;
  letter-spacing: 0.15em;
  font-weight: 700;
  color: var(--text-lo);
}
.seg-btn.on { background: var(--surface-3); color: var(--gold); box-shadow: inset 0 0 8px var(--gold-glow); }

.btn-primary {
  display: inline-flex; align-items: center; gap: 8px;
  background: linear-gradient(135deg, var(--gold-2), var(--gold));
  color: #0a0400;
  border-radius: 8px;
  padding: 9px 16px;
  font-family: var(--f-title);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  border: 1px solid var(--gold);
  box-shadow: 0 0 18px var(--gold-glow), inset 0 0 8px oklch(1 0 0 / 0.2);
  transition: all 0.2s var(--ease-spring);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 0 28px var(--gold-glow), inset 0 0 8px oklch(1 0 0 / 0.25); }
.btn-primary span:first-child { font-size: 16px; line-height: 1; }
.btn-secondary {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--text-md);
  border-radius: 8px;
  padding: 8px 14px;
  font-family: var(--f-title);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  transition: all 0.2s;
}
.btn-secondary:hover { color: var(--text-hi); border-color: var(--border-hi); }
.btn-icon {
  width: 32px; height: 32px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-md);
  font-size: 13px;
  transition: all 0.2s;
}
.btn-icon:hover { color: var(--gold); border-color: var(--gold); }
.btn-icon-mini {
  width: 24px; height: 24px;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-md);
  font-size: 10px;
  background: var(--bg-2);
}
.btn-icon-mini:hover { color: var(--gold); border-color: var(--gold); }
.btn-mini {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 4px 9px;
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.15em;
  color: var(--text-md);
  font-weight: 700;
}
.btn-mini:hover { color: var(--gold); border-color: var(--gold); }

/* ── PANEL BASE ─────────────────────────────────────────── */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  position: relative;
  overflow: hidden;
}
.panel::before {
  content:'';
  position: absolute; inset: 0;
  pointer-events: none;
  background-image:
    repeating-linear-gradient(0deg,  transparent, transparent 28px, oklch(1 0 0 / 0.012) 28px, oklch(1 0 0 / 0.012) 29px),
    repeating-linear-gradient(90deg, transparent, transparent 28px, oklch(1 0 0 / 0.012) 28px, oklch(1 0 0 / 0.012) 29px);
}
.panel-gold {
  border-color: oklch(0.78 0.16 82 / 0.4);
  box-shadow: 0 0 24px oklch(0.78 0.16 82 / 0.08), inset 0 0 22px oklch(0.78 0.16 82 / 0.03);
}
.panel-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 1;
  flex-wrap: wrap;
}
.panel-eyebrow {
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.3em;
  color: var(--gold);
  text-transform: uppercase;
}
.panel-title {
  font-family: var(--f-title);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--text-hi);
  white-space: nowrap;
}
.panel-spacer { flex: 1; }
.panel-aux {
  font-family: var(--f-mono);
  font-size: 10px;
  color: var(--text-lo);
  letter-spacing: 0.08em;
}

/* ── DAY VIEW ───────────────────────────────────────────── */
.day-view {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
  gap: 14px;
  flex: 1;
  min-height: 0;
}
.day-main { display: flex; flex-direction: column; min-height: 0; }
.day-side { display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow-y: auto; }

.day-stats { display: flex; align-items: center; gap: 12px; }
.day-progress { display: flex; align-items: center; gap: 10px; }
.dp-num {
  display: flex; align-items: baseline; gap: 4px;
  font-family: var(--f-title);
}
.dp-num strong { font-size: 18px; color: var(--gold); }
.dp-num span { font-size: 10px; color: var(--text-lo); letter-spacing: 0.08em; }
.dp-bar {
  width: 160px; height: 6px;
  background: var(--bg-3);
  border-radius: 3px;
  overflow: hidden;
  border: 1px solid var(--border-lo);
}
.dp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-2), var(--gold));
  box-shadow: 0 0 8px var(--gold-glow);
  transition: width 0.6s var(--ease-out);
}
.dp-pct {
  font-family: var(--f-title);
  font-size: 12px;
  color: var(--gold);
  font-weight: 700;
}

/* ACTIVE BLOCK */
.timeline-rail {
  padding: 14px 16px 8px;
  position: relative;
  z-index: 1;
}
.active-block {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 14px;
  padding: 12px 16px;
  background: linear-gradient(135deg, oklch(0.32 0.18 295 / 0.25), oklch(0.32 0.18 82 / 0.18));
  border: 1px solid oklch(0.68 0.22 295 / 0.45);
  border-radius: var(--r-md);
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 26px var(--violet-glow), inset 0 0 18px oklch(0.68 0.22 295 / 0.06);
}
.active-block::before {
  content: '';
  position: absolute;
  left: -120%; top: 0;
  width: 70%; height: 100%;
  background: linear-gradient(90deg, transparent, oklch(1 0 0 / 0.08), transparent);
  animation: sweep 3.5s linear infinite;
}
@keyframes sweep { to { left: 200%; } }
.ab-pulse {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--violet);
  box-shadow: 0 0 14px var(--violet-glow);
  animation: pulse-bar 1.6s ease-in-out infinite;
}
@keyframes pulse-bar { 50% { opacity: 0.4; } }
.ab-time {
  padding-left: 8px;
  font-family: var(--f-title);
}
.ab-now { font-size: 11px; color: var(--violet); letter-spacing: 0.18em; font-weight: 700; }
.ab-fin { font-size: 9px; color: var(--text-md); letter-spacing: 0.12em; margin-top: 2px; }
.ab-tag {
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.3em;
  color: var(--violet);
  margin-bottom: 4px;
}
.ab-title {
  font-family: var(--f-title);
  font-size: 16px;
  font-weight: 700;
  color: var(--text-hi);
  letter-spacing: 0.04em;
  margin-bottom: 2px;
}
.ab-sub { font-size: 11px; color: var(--text-md); }
.ab-ring {
  position: relative;
  width: 64px; height: 64px;
  display: flex; align-items: center; justify-content: center;
}
.ab-ring-num {
  position: absolute;
  font-family: var(--f-title);
  font-size: 11px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.06em;
}

/* SLOT STACK */
.slot-stack {
  flex: 1;
  overflow-y: auto;
  padding: 8px 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: relative;
  z-index: 1;
  min-height: 0;
}
.slot {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 6px 4px;
  border-left: 2px solid var(--border-lo);
  padding-left: 14px;
  position: relative;
  transition: border-color 0.2s, padding 0.2s;
}
.slot.over { border-color: var(--gold); background: oklch(0.78 0.16 82 / 0.04); border-radius: 6px; }
.slot-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: -10px;
  margin-bottom: 4px;
}
.slot-glyph {
  width: 18px; height: 18px;
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px;
  color: var(--gold);
}
.slot-label {
  font-family: var(--f-title);
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--text-md);
  text-transform: uppercase;
  font-weight: 700;
}
.slot-time { font-family: var(--f-mono); font-size: 10px; color: var(--text-lo); }
.slot-count {
  margin-left: auto;
  font-family: var(--f-mono);
  font-size: 10px;
  color: var(--text-lo);
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 6px;
}

/* ── QUEST CARD ─────────────────────────────────────────── */
.quest-card {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 14px;
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px 14px;
  position: relative;
  transition: all 0.22s var(--ease-out);
  cursor: grab;
}
.quest-card:active { cursor: grabbing; }
.quest-card::before {
  content: '';
  position: absolute;
  left: 0; top: 12px; bottom: 12px;
  width: 3px;
  background: currentColor;
  border-radius: 0 2px 2px 0;
  opacity: 0.5;
}
.quest-card.cat-gold   { color: var(--gold); }
.quest-card.cat-violet { color: var(--violet); }
.quest-card.cat-cyan   { color: var(--cyan); }
.quest-card.cat-mint   { color: var(--mint); }
.quest-card.cat-rose   { color: var(--rose); }
.quest-card:hover {
  border-color: currentColor;
  transform: translateY(-1px);
  box-shadow: 0 0 18px oklch(from currentColor l c h / 0.2);
}
.quest-card.done {
  opacity: 0.55;
  filter: saturate(0.4);
}
.quest-card.done .qc-title { text-decoration: line-through; }
.quest-card.saga {
  border-style: solid;
  background: linear-gradient(135deg, oklch(0.18 0.15 295 / 0.4), var(--surface));
  border-color: oklch(0.68 0.22 295 / 0.5);
  box-shadow: 0 0 18px var(--violet-glow);
}
.quest-card.saga::after {
  content: 'SAGA';
  position: absolute;
  top: 8px; right: 110px;
  font-family: var(--f-title);
  font-size: 8px;
  letter-spacing: 0.3em;
  color: var(--violet);
  background: oklch(0 0 0 / 0.4);
  padding: 1px 6px;
  border: 1px solid oklch(0.68 0.22 295 / 0.4);
  border-radius: 3px;
}
.qc-left {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding-top: 2px;
}
.qc-check {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 1.5px solid var(--border-hi);
  background: var(--bg-2);
  display: flex; align-items: center; justify-content: center;
  color: transparent;
  font-size: 12px;
  font-weight: 800;
  transition: all 0.25s var(--ease-spring);
}
.qc-check:hover { border-color: var(--mint); transform: scale(1.05); }
.qc-check.on {
  background: linear-gradient(135deg, var(--mint-2), var(--mint));
  border-color: var(--mint);
  color: #021;
  box-shadow: 0 0 12px var(--mint-glow);
}
.qc-diff {
  width: 24px; height: 24px;
  border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--f-title);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.02em;
}
.diff-S { background: linear-gradient(135deg, oklch(0.55 0.20 320), oklch(0.7 0.22 320)); color: #fff; box-shadow: 0 0 10px oklch(0.7 0.22 320 / 0.45); }
.diff-A { background: linear-gradient(135deg, oklch(0.50 0.20 22), var(--rose)); color: #fff; box-shadow: 0 0 8px var(--rose-glow); }
.diff-B { background: linear-gradient(135deg, var(--violet-2), var(--violet)); color: #fff; box-shadow: 0 0 8px var(--violet-glow); }
.diff-C { background: linear-gradient(135deg, var(--cyan-2), var(--cyan)); color: #021; box-shadow: 0 0 8px var(--cyan-glow); }
.diff-D { background: var(--bg-3); color: var(--text-md); border: 1px solid var(--border-hi); }

.qc-body { min-width: 0; }
.qc-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.qc-title {
  font-family: var(--f-title);
  font-size: 14px;
  font-weight: 700;
  color: var(--text-hi);
  letter-spacing: 0.03em;
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.qc-priority {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.18em;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid;
  text-transform: uppercase;
}
.qc-priority .pp { font-size: 10px; letter-spacing: 0; }
.pri-rose   { color: var(--rose);   border-color: oklch(0.74 0.18 5 / 0.4);  background: oklch(0.74 0.18 5 / 0.1); }
.pri-gold   { color: var(--gold);   border-color: oklch(0.78 0.16 82 / 0.4); background: oklch(0.78 0.16 82 / 0.1); }
.pri-cyan   { color: var(--cyan);   border-color: oklch(0.78 0.16 205 / 0.4); background: oklch(0.78 0.16 205 / 0.1); }
.pri-mint   { color: var(--mint);   border-color: oklch(0.76 0.14 162 / 0.4); background: oklch(0.76 0.14 162 / 0.1); }
.pri-violet { color: var(--violet); border-color: oklch(0.68 0.22 295 / 0.4); background: oklch(0.68 0.22 295 / 0.1); }
.qc-desc {
  font-size: 11px;
  color: var(--text-md);
  margin-bottom: 8px;
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.qc-meta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  align-items: center;
  font-size: 10px;
  color: var(--text-lo);
  margin-bottom: 6px;
}
.qc-cat {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.15em;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid;
  text-transform: uppercase;
}
.cat-pill-gold   { color: var(--gold);   border-color: oklch(0.78 0.16 82 / 0.4);  background: oklch(0.78 0.16 82 / 0.1); }
.cat-pill-violet { color: var(--violet); border-color: oklch(0.68 0.22 295 / 0.4); background: oklch(0.68 0.22 295 / 0.1); }
.cat-pill-cyan   { color: var(--cyan);   border-color: oklch(0.78 0.16 205 / 0.4); background: oklch(0.78 0.16 205 / 0.1); }
.cat-pill-mint   { color: var(--mint);   border-color: oklch(0.76 0.14 162 / 0.4); background: oklch(0.76 0.14 162 / 0.1); }
.cat-pill-rose   { color: var(--rose);   border-color: oklch(0.74 0.18 5 / 0.4);   background: oklch(0.74 0.18 5 / 0.1); }
.qc-est, .qc-deadline { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.04em; }
.qc-deadline.due-now    { color: var(--violet); font-weight: 600; }
.qc-deadline.due-today  { color: var(--gold); font-weight: 600; }
.qc-deadline.due-soon   { color: var(--text-md); }
.qc-deadline.due-month  { color: var(--text-lo); }
.qc-deadline.due-evening{ color: var(--cyan); }
.qc-deadline.due-done   { color: var(--mint); }
.qc-streak {
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.15em;
  font-weight: 700;
  color: var(--gold);
  background: oklch(0.78 0.16 82 / 0.1);
  border: 1px solid oklch(0.78 0.16 82 / 0.3);
  padding: 1px 7px;
  border-radius: 999px;
}
.qc-combo {
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.15em;
  font-weight: 800;
  color: #fff;
  background: linear-gradient(135deg, var(--violet-2), var(--rose));
  padding: 1px 7px;
  border-radius: 999px;
  box-shadow: 0 0 8px var(--violet-glow);
}
.qc-subprog {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 6px;
}
.qc-sub-track {
  flex: 1; height: 4px;
  background: var(--bg-3);
  border-radius: 2px;
  overflow: hidden;
}
.qc-sub-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--violet-2), var(--violet));
  box-shadow: 0 0 6px var(--violet-glow);
}
.qc-sub-num { font-family: var(--f-mono); font-size: 10px; color: var(--violet); }
.qc-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.qc-tag {
  font-family: var(--f-mono);
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 0.04em;
}
.qc-tag:hover { color: var(--text-md); }

.qc-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}
.qc-reward {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--f-title);
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--bg-2);
  border: 1px solid;
  letter-spacing: 0.04em;
}
.qc-reward span { font-size: 8px; opacity: 0.7; letter-spacing: 0.15em; }
.qc-reward.xp   { color: var(--violet); border-color: oklch(0.68 0.22 295 / 0.4); }
.qc-reward.coin { color: var(--gold);   border-color: oklch(0.78 0.16 82 / 0.4); }
.qc-more {
  margin-top: 2px;
  width: 22px; height: 22px;
  border-radius: 4px;
  color: var(--text-lo);
  font-size: 14px;
}
.qc-more:hover { background: var(--surface-3); color: var(--gold); }

/* expanded */
.qc-expanded {
  grid-column: 1 / -1;
  padding-top: 12px;
  margin-top: 4px;
  border-top: 1px dashed var(--border);
  display: flex;
  flex-direction: column;
  gap: 12px;
  animation: expand-in 0.3s var(--ease-out);
}
@keyframes expand-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.qcx-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px 14px;
}
.detail-label {
  font-family: var(--f-title);
  font-size: 8px;
  letter-spacing: 0.2em;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 2px;
}
.detail-value { font-size: 12px; color: var(--text-hi); font-weight: 500; }
.qcx-note {
  padding: 10px 12px;
  border-left: 2px solid var(--gold);
  background: oklch(0.78 0.16 82 / 0.05);
  border-radius: 0 6px 6px 0;
}
.qcx-note-label {
  font-family: var(--f-title);
  font-size: 8px;
  letter-spacing: 0.3em;
  color: var(--gold);
  margin-bottom: 4px;
}
.qcx-note-text { font-size: 11px; color: var(--text-md); line-height: 1.55; font-style: italic; }
.qcx-progress-label {
  display: flex; justify-content: space-between;
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--text-md);
  margin-bottom: 4px;
}
.qcx-progress-label span:last-child { color: var(--gold); }
.qcx-progress-bar {
  height: 6px;
  background: var(--bg-3);
  border: 1px solid var(--border-lo);
  border-radius: 3px;
  overflow: hidden;
}
.qcx-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-2), var(--gold));
  box-shadow: 0 0 8px var(--gold-glow);
  transition: width 0.6s var(--ease-out);
}
.qcx-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.qcx-btn {
  font-family: var(--f-title);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.15em;
  padding: 7px 14px;
  border-radius: 6px;
  border: 1px solid;
  text-transform: uppercase;
  transition: all 0.2s;
}
.qcx-btn.primary {
  background: linear-gradient(135deg, var(--gold-2), var(--gold));
  border-color: var(--gold);
  color: #0a0400;
  box-shadow: 0 0 10px var(--gold-glow);
}
.qcx-btn.primary:hover { transform: translateY(-1px); box-shadow: 0 0 18px var(--gold-glow); }
.qcx-btn.ghost {
  background: var(--bg-2); border-color: var(--border); color: var(--text-md);
}
.qcx-btn.ghost:hover { color: var(--text-hi); border-color: var(--border-hi); }
.qcx-btn.danger { background: oklch(0.62 0.24 22 / 0.08); border-color: oklch(0.62 0.24 22 / 0.4); color: var(--rose); }
.qcx-btn.danger:hover { background: oklch(0.62 0.24 22 / 0.16); }

/* EMPTY SLOT */
.empty-slot {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border: 1.5px dashed var(--border);
  border-radius: var(--r-md);
  background: oklch(1 0 0 / 0.01);
}
.es-orb {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--bg-3);
  border: 1.5px dashed var(--border-hi);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  color: var(--text-lo);
}
.es-text { font-size: 11px; color: var(--text-lo); font-style: italic; }

/* ── WEEK PEEK ──────────────────────────────────────────── */
.side-panel { display: flex; flex-direction: column; min-height: 0; }
.weekpeek-stack {
  display: flex;
  flex-direction: column;
  padding: 8px 6px 12px;
  position: relative;
  z-index: 1;
}
.wp-day {
  display: grid;
  grid-template-columns: 50px 1fr;
  gap: 8px;
  padding: 8px 10px;
  border-bottom: 1px dashed var(--border-lo);
}
.wp-day:last-child { border-bottom: none; }
.wp-day.today {
  background: linear-gradient(90deg, oklch(0.78 0.16 82 / 0.08), transparent);
  border-left: 2px solid var(--gold);
  border-radius: 0 6px 6px 0;
}
.wp-rail { text-align: center; }
.wp-short {
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--text-lo);
}
.wp-day.today .wp-short { color: var(--gold); }
.wp-num {
  font-family: var(--f-title);
  font-size: 18px;
  font-weight: 700;
  line-height: 1;
  color: var(--text-md);
}
.wp-day.today .wp-num { color: var(--gold); text-shadow: 0 0 10px var(--gold-glow); }
.wp-meta {
  display: flex; align-items: center; gap: 8px;
  font-size: 10px;
  margin-bottom: 4px;
}
.wp-count { color: var(--text-md); font-family: var(--f-mono); }
.wp-done { color: var(--gold); font-family: var(--f-mono); }
.wp-today {
  font-family: var(--f-title);
  font-size: 8px;
  letter-spacing: 0.25em;
  color: var(--gold);
  background: oklch(0.78 0.16 82 / 0.12);
  border: 1px solid oklch(0.78 0.16 82 / 0.4);
  border-radius: 999px;
  padding: 1px 7px;
}
.wp-tasks { display: flex; flex-direction: column; gap: 4px; }
.wp-task {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 8px;
  background: var(--bg-2);
  border: 1px solid var(--border-lo);
  border-radius: 5px;
  font-size: 11px;
  transition: all 0.18s;
}
.wp-task:hover { border-color: currentColor; }
.wp-task.done { opacity: 0.5; }
.wp-task.done .wp-task-title { text-decoration: line-through; }
.wp-task-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 4px currentColor; }
.wp-task.cat-dot-gold   { color: var(--gold); }
.wp-task.cat-dot-violet { color: var(--violet); }
.wp-task.cat-dot-cyan   { color: var(--cyan); }
.wp-task.cat-dot-mint   { color: var(--mint); }
.wp-task.cat-dot-rose   { color: var(--rose); }
.wp-task-title {
  flex: 1;
  color: var(--text-hi);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.wp-task-diff {
  width: 16px; height: 16px;
  font-size: 9px; font-family: var(--f-title); font-weight: 900;
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
}
.wp-more {
  font-family: var(--f-mono);
  font-size: 10px;
  color: var(--text-dim);
  padding-left: 12px;
  font-style: italic;
}
.wp-empty {
  font-family: var(--f-mono);
  font-size: 10px;
  color: var(--text-dim);
  padding: 4px 8px;
  font-style: italic;
}

/* MONTH PEEK */
.monthpeek-grid {
  padding: 10px 14px;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  position: relative;
  z-index: 1;
}
.mp-dow {
  font-family: var(--f-title);
  font-size: 8px;
  letter-spacing: 0.15em;
  color: var(--text-dim);
  text-align: center;
  padding-bottom: 4px;
}
.mp-cell {
  aspect-ratio: 1;
  background: var(--bg-2);
  border: 1px solid var(--border-lo);
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: var(--f-mono);
  font-size: 10px;
  color: var(--text-md);
  position: relative;
  cursor: pointer;
  transition: all 0.18s;
}
.mp-cell:hover { border-color: var(--gold); color: var(--gold); }
.mp-cell.muted { border: none; background: none; cursor: default; }
.mp-cell.past { opacity: 0.45; }
.mp-cell.today {
  background: linear-gradient(135deg, var(--gold-2), var(--gold));
  color: #0a0400;
  border-color: var(--gold);
  box-shadow: 0 0 10px var(--gold-glow);
  font-weight: 700;
}
.mp-num { line-height: 1; }
.mp-pip {
  position: absolute;
  bottom: 3px;
  width: 14px; height: 2px;
  border-radius: 1px;
  background: var(--violet);
}
.mp-pip.pip-1 { width: 8px; background: var(--mint); }
.mp-pip.pip-2 { width: 14px; background: var(--cyan); }
.mp-pip.pip-3 { width: 18px; background: var(--violet); }
.mp-pip.pip-4 { width: 22px; background: var(--gold); box-shadow: 0 0 6px var(--gold-glow); }
.mp-legend {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 14px 12px;
  font-family: var(--f-mono);
  font-size: 9px;
  color: var(--text-lo);
  position: relative;
  z-index: 1;
}
.mp-leg-dot { display: inline-block; height: 3px; border-radius: 1.5px; }
.month-nav { display: flex; gap: 4px; }

/* ── SCHEDULE STRIP ─────────────────────────────────────── */
.timeline-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.schedule-list {
  flex: 1;
  overflow-y: auto;
  padding: 10px 14px 14px;
  position: relative; z-index: 1;
}
.sched-row {
  display: grid;
  grid-template-columns: 46px 22px 1fr;
  gap: 8px;
  align-items: stretch;
  min-height: 38px;
}
.sched-time {
  display: flex;
  flex-direction: column;
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--text-lo);
  padding-top: 2px;
}
.sched-row.active .st-start { color: var(--gold); font-weight: 700; }
.sched-row.done .sched-time  { color: var(--text-dim); }
.st-end { font-size: 9px; opacity: 0.6; }
.sched-spine {
  display: flex; flex-direction: column;
  align-items: center;
  position: relative;
}
.sched-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--bg-3);
  border: 1.5px solid var(--border-hi);
  margin-top: 4px;
  flex-shrink: 0;
  z-index: 1;
}
.sched-dot.done {
  background: var(--mint);
  border-color: var(--mint);
  box-shadow: 0 0 8px var(--mint-glow);
}
.sched-dot.active {
  background: var(--gold);
  border-color: var(--gold);
  box-shadow: 0 0 10px var(--gold-glow);
  animation: pulse-dot 1.5s ease-in-out infinite;
}
@keyframes pulse-dot { 50% { transform: scale(1.3); } }
.sched-line {
  flex: 1;
  width: 1.5px;
  background: linear-gradient(180deg, var(--border-hi), var(--border-lo));
  margin: 2px 0 -4px;
}
.sched-info {
  padding: 0 0 12px;
}
.sched-label {
  font-family: var(--f-title);
  font-size: 12px;
  color: var(--text-hi);
  letter-spacing: 0.04em;
  font-weight: 600;
}
.sched-row.done .sched-label { color: var(--text-lo); text-decoration: line-through; }
.sched-tag { margin-top: 2px; }
.now-tag {
  font-family: var(--f-title);
  font-size: 8px;
  letter-spacing: 0.25em;
  color: var(--gold);
  background: oklch(0.78 0.16 82 / 0.12);
  border: 1px solid oklch(0.78 0.16 82 / 0.4);
  border-radius: 3px;
  padding: 1px 5px;
}
.done-tag {
  font-family: var(--f-title);
  font-size: 8px;
  letter-spacing: 0.25em;
  color: var(--mint);
}

/* ── WEEK VIEW ──────────────────────────────────────────── */
.week-view { display: flex; flex-direction: column; gap: 14px; flex: 1; min-height: 0; }
.wv-stats { padding: 14px 16px; }
.week-stats {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px;
  position: relative;
  z-index: 1;
}
.ws-card {
  padding: 12px 14px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  border-top: 2px solid;
  position: relative;
}
.ws-card.ws-gold   { border-top-color: var(--gold);   box-shadow: 0 -3px 14px oklch(0.78 0.16 82 / 0.1); }
.ws-card.ws-violet { border-top-color: var(--violet); box-shadow: 0 -3px 14px var(--violet-glow); }
.ws-card.ws-cyan   { border-top-color: var(--cyan);   box-shadow: 0 -3px 14px var(--cyan-glow); }
.ws-card.ws-rose   { border-top-color: var(--rose);   box-shadow: 0 -3px 14px var(--rose-glow); }
.ws-card.ws-mint   { border-top-color: var(--mint);   box-shadow: 0 -3px 14px var(--mint-glow); }
.ws-label {
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.22em;
  color: var(--text-lo);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.ws-value {
  font-family: var(--f-title);
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.ws-card.ws-gold   .ws-value { color: var(--gold);   text-shadow: 0 0 14px var(--gold-glow); }
.ws-card.ws-violet .ws-value { color: var(--violet); text-shadow: 0 0 14px var(--violet-glow); }
.ws-card.ws-cyan   .ws-value { color: var(--cyan);   text-shadow: 0 0 14px var(--cyan-glow); }
.ws-card.ws-rose   .ws-value { color: var(--rose);   text-shadow: 0 0 14px var(--rose-glow); }
.ws-card.ws-mint   .ws-value { color: var(--mint);   text-shadow: 0 0 14px var(--mint-glow); }
.ws-sub { font-size: 10px; color: var(--text-lo); margin-top: 2px; font-family: var(--f-mono); }

.wv-board {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 10px;
  min-height: 0;
}
.wv-col { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.wv-col.today { border-color: oklch(0.78 0.16 82 / 0.6); box-shadow: 0 0 20px var(--gold-glow); }
.wv-col.over { border-color: var(--gold); background: oklch(0.78 0.16 82 / 0.04); }
.wv-col-head {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  position: relative; z-index: 1;
}
.wv-day-info { display: flex; align-items: center; gap: 8px; }
.wv-short {
  font-family: var(--f-title);
  font-size: 12px;
  letter-spacing: 0.2em;
  color: var(--text-md);
  font-weight: 700;
}
.wv-col.today .wv-short { color: var(--gold); }
.wv-date { font-family: var(--f-mono); font-size: 10px; color: var(--text-lo); }
.wv-today-pill {
  margin-left: auto;
  font-family: var(--f-title);
  font-size: 8px;
  letter-spacing: 0.25em;
  color: var(--gold);
  background: oklch(0.78 0.16 82 / 0.12);
  border: 1px solid oklch(0.78 0.16 82 / 0.4);
  border-radius: 999px;
  padding: 1px 7px;
}
.wv-progress { display: flex; align-items: center; gap: 6px; }
.wv-prog-bar {
  flex: 1;
  height: 4px;
  background: var(--bg-3);
  border-radius: 2px;
  border: 1px solid var(--border-lo);
  overflow: hidden;
}
.wv-prog-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--mint-2), var(--mint));
  box-shadow: 0 0 6px var(--mint-glow);
}
.wv-prog-num { font-family: var(--f-mono); font-size: 10px; color: var(--text-md); }
.wv-stack {
  flex: 1;
  padding: 8px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
  z-index: 1;
}
.wv-empty {
  text-align: center;
  padding: 20px 8px;
  color: var(--text-dim);
}
.wv-empty-orb {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1.5px dashed var(--border-hi);
  margin: 0 auto 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  color: var(--text-dim);
}
.wv-empty-text { font-family: var(--f-title); font-size: 9px; letter-spacing: 0.2em; }

/* ── MINI QUEST CARD ────────────────────────────────────── */
.qcm {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 8px 10px;
  position: relative;
  cursor: grab;
  transition: all 0.2s;
}
.qcm:active { cursor: grabbing; }
.qcm::before {
  content: '';
  position: absolute;
  left: 0; top: 6px; bottom: 6px;
  width: 2px;
  background: currentColor;
  border-radius: 0 2px 2px 0;
  opacity: 0.6;
}
.qcm.cat-gold   { color: var(--gold); }
.qcm.cat-violet { color: var(--violet); }
.qcm.cat-cyan   { color: var(--cyan); }
.qcm.cat-mint   { color: var(--mint); }
.qcm.cat-rose   { color: var(--rose); }
.qcm:hover { border-color: currentColor; transform: translateY(-1px); }
.qcm.done { opacity: 0.5; filter: saturate(0.5); }
.qcm.done .qcm-title { text-decoration: line-through; }
.qcm.saga { background: linear-gradient(135deg, oklch(0.20 0.15 295 / 0.4), var(--surface)); border-color: oklch(0.68 0.22 295 / 0.5); }
.qcm-top {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 4px;
}
.qcm-check {
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 1.5px solid var(--border-hi);
  background: var(--bg-2);
  font-size: 9px;
  color: transparent;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.qcm-check.on {
  background: var(--mint); border-color: var(--mint); color: #021;
  box-shadow: 0 0 8px var(--mint-glow);
}
.qcm-diff {
  width: 18px; height: 18px;
  font-size: 9px;
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
}
.qcm-pri { font-size: 9px; margin-left: auto; }
.qcm-title {
  font-family: var(--f-title);
  font-size: 11px;
  color: var(--text-hi);
  font-weight: 600;
  letter-spacing: 0.02em;
  margin-bottom: 5px;
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.qcm-rewards { display: flex; gap: 4px; margin-bottom: 5px; }
.qcm-xp, .qcm-coin {
  font-family: var(--f-title);
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 999px;
  border: 1px solid;
}
.qcm-xp { color: var(--violet); border-color: oklch(0.68 0.22 295 / 0.4); }
.qcm-coin { color: var(--gold); border-color: oklch(0.78 0.16 82 / 0.4); }
.qcm-xp small, .qcm-coin small { font-size: 7px; opacity: 0.7; margin-left: 2px; }
.qcm-subprog {
  display: flex; align-items: center; gap: 5px;
  margin-bottom: 5px;
}
.qcm-track {
  flex: 1; height: 3px;
  background: var(--bg-3);
  border-radius: 2px;
  overflow: hidden;
}
.qcm-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--violet-2), var(--violet));
  box-shadow: 0 0 4px var(--violet-glow);
}
.qcm-num { font-family: var(--f-mono); font-size: 9px; color: var(--violet); }
.qcm-foot {
  display: flex; justify-content: space-between; gap: 4px;
  font-size: 9px;
}
.qcm-cat {
  font-family: var(--f-title);
  font-size: 8px;
  letter-spacing: 0.15em;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 999px;
  border: 1px solid;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.qcm-est { font-family: var(--f-mono); font-size: 9px; color: var(--text-lo); }
.qcm-expand {
  margin-top: 8px; padding-top: 8px;
  border-top: 1px dashed var(--border);
  font-size: 10px;
  color: var(--text-md);
  line-height: 1.5;
}
.qcm-expand-actions { display: flex; gap: 4px; margin-top: 8px; }

/* ── MONTH VIEW ─────────────────────────────────────────── */
.month-view { display: flex; flex-direction: column; gap: 14px; flex: 1; min-height: 0; }
.mv-toolbar {
  padding: 14px 18px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 24px;
  align-items: center;
}
.mv-title-block { position: relative; z-index: 1; }
.mv-eyebrow {
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.3em;
  color: var(--gold);
  margin-bottom: 4px;
  display: block;
}
.mv-title {
  font-family: var(--f-title);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 0.06em;
  background: linear-gradient(135deg, var(--text-hi), var(--gold));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.mv-title span { color: var(--text-lo); font-weight: 400; -webkit-text-fill-color: var(--text-lo); }
.mv-month-stats {
  display: flex;
  gap: 32px;
  justify-content: center;
  position: relative; z-index: 1;
}
.mv-stat { text-align: center; }
.mv-stat-num {
  font-family: var(--f-title);
  font-size: 22px;
  font-weight: 700;
  color: var(--gold);
  text-shadow: 0 0 12px var(--gold-glow);
  line-height: 1;
}
.mv-stat-lbl {
  font-family: var(--f-title);
  font-size: 8px;
  letter-spacing: 0.2em;
  color: var(--text-lo);
  text-transform: uppercase;
  margin-top: 4px;
}
.mv-nav { display: flex; gap: 6px; position: relative; z-index: 1; }
.mv-body {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 14px;
  min-height: 0;
}
.mv-grid { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.mv-dow-row {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border-bottom: 1px solid var(--border);
  position: relative; z-index: 1;
}
.mv-dow {
  padding: 10px 14px;
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.25em;
  color: var(--text-lo);
  border-right: 1px solid var(--border-lo);
}
.mv-dow:last-child { border-right: none; }
.mv-cells {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-auto-rows: minmax(0, 1fr);
  position: relative; z-index: 1;
}
.mv-cell {
  border-right: 1px solid var(--border-lo);
  border-bottom: 1px solid var(--border-lo);
  padding: 6px 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-height: 80px;
  position: relative;
  background: oklch(0 0 0 / 0.15);
  transition: background 0.2s;
}
.mv-cell:hover { background: oklch(0.78 0.16 82 / 0.03); }
.mv-cell.muted { background: oklch(0 0 0 / 0.3); }
.mv-cell-head { display: flex; justify-content: space-between; align-items: center; }
.mv-cell-num {
  font-family: var(--f-title);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-md);
}
.mv-cell.today { background: linear-gradient(180deg, oklch(0.78 0.16 82 / 0.08), oklch(0.78 0.16 82 / 0.02)); box-shadow: inset 0 0 18px oklch(0.78 0.16 82 / 0.1); }
.mv-cell.today .mv-cell-num { color: var(--gold); text-shadow: 0 0 8px var(--gold-glow); }
.mv-cell-today {
  font-family: var(--f-title);
  font-size: 7px;
  letter-spacing: 0.25em;
  color: var(--gold);
  background: oklch(0.78 0.16 82 / 0.18);
  padding: 1px 5px;
  border-radius: 3px;
  border: 1px solid oklch(0.78 0.16 82 / 0.4);
}
.mv-cell-tasks { display: flex; flex-direction: column; gap: 3px; }
.mv-pill {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 2px 5px;
  border-radius: 3px;
  font-size: 9px;
  border: 1px solid;
  min-width: 0;
}
.mv-pill.done { opacity: 0.5; text-decoration: line-through; }
.mv-pill.saga { box-shadow: 0 0 8px var(--violet-glow); }
.mv-pill-rank {
  font-family: var(--f-title);
  font-size: 8px;
  font-weight: 900;
  width: 14px; height: 14px;
  border-radius: 2px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.mv-pill-title {
  font-size: 10px;
  color: var(--text-hi);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.mv-overflow {
  font-family: var(--f-mono);
  font-size: 9px;
  color: var(--text-dim);
  padding: 1px 4px;
}

/* SAGA PANEL */
.saga-panel { display: flex; flex-direction: column; min-height: 0; }
.saga-list {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative; z-index: 1;
}
.saga-card {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 12px;
  padding: 12px;
  background: linear-gradient(135deg, oklch(0.20 0.15 295 / 0.3), var(--surface));
  border: 1px solid oklch(0.68 0.22 295 / 0.4);
  border-radius: var(--r-md);
  box-shadow: 0 0 18px var(--violet-glow);
}
.saga-glyph {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: radial-gradient(circle, oklch(0.68 0.22 295 / 0.3), transparent 70%);
  border: 1.5px solid var(--violet);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  color: var(--violet);
  box-shadow: 0 0 16px var(--violet-glow);
}
.saga-title {
  font-family: var(--f-title);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--text-hi);
}
.saga-desc {
  font-size: 11px;
  color: var(--text-md);
  margin-top: 2px;
  line-height: 1.45;
}
.saga-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 6px 0;
  font-family: var(--f-mono);
  font-size: 10px;
  color: var(--text-lo);
}
.saga-xp { color: var(--violet); font-weight: 700; }
.saga-bar {
  height: 5px;
  background: var(--bg-3);
  border-radius: 2px;
  overflow: hidden;
  border: 1px solid var(--border-lo);
}
.saga-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--violet-2), var(--violet));
  box-shadow: 0 0 8px var(--violet-glow);
}

/* ACTIVITY FEED */
.activity-feed {
  border-top: 1px dashed var(--border);
  padding-top: 12px;
  margin-top: 4px;
}
.af-head {
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.3em;
  color: var(--gold);
  margin-bottom: 8px;
}
.af-list { display: flex; flex-direction: column; gap: 4px; list-style: none; }
.af-row {
  display: grid;
  grid-template-columns: 24px 1fr auto;
  gap: 8px;
  align-items: center;
  padding: 5px 8px;
  background: var(--bg-2);
  border-radius: 5px;
  border-left: 2px solid var(--border);
  font-size: 11px;
}
.af-row.kind-complete { border-left-color: var(--mint); }
.af-row.kind-xp       { border-left-color: var(--violet); }
.af-row.kind-levelup  { border-left-color: var(--gold); }
.af-row.kind-combo    { border-left-color: var(--rose); }
.af-row.kind-achieve  { border-left-color: var(--cyan); }
.af-glyph {
  width: 22px; height: 22px;
  background: var(--bg-3);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  color: var(--gold);
}
.af-text { color: var(--text-md); }
.af-ts { font-family: var(--f-mono); font-size: 9px; color: var(--text-dim); }

/* ── HERO RAIL ──────────────────────────────────────────── */
.herorail {
  background: linear-gradient(180deg, var(--bg-1), var(--bg-0));
  border-left: 1px solid var(--border);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
  transition: opacity 0.3s, transform 0.3s;
}
.hero-card {
  padding: 16px 14px 14px;
  text-align: center;
}
.hero-portrait {
  position: relative;
  width: 84px; height: 84px;
  margin: 4px auto 8px;
}
.hp-ring {
  width: 100%; height: 100%;
  border-radius: 50%;
  background: conic-gradient(from 0deg, var(--gold), var(--violet), var(--cyan), var(--gold));
  padding: 2px;
  box-shadow: 0 0 20px var(--gold-glow), 0 0 40px var(--violet-glow);
  animation: rot 24s linear infinite;
}
@keyframes rot { to { transform: rotate(360deg); } }
.hp-inner {
  width: 100%; height: 100%;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--bg-2), var(--bg-3));
  display: flex; align-items: center; justify-content: center;
}
.hp-mark {
  font-family: var(--f-title);
  font-size: 30px;
  font-weight: 900;
  background: linear-gradient(135deg, var(--gold), var(--violet));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hp-rank {
  position: absolute;
  bottom: -2px; right: -2px;
  width: 26px; height: 26px;
  background: linear-gradient(135deg, oklch(0.55 0.20 320), oklch(0.7 0.22 320));
  border-radius: 6px;
  border: 2px solid var(--bg-1);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--f-title);
  font-size: 12px;
  font-weight: 900;
  color: #fff;
  box-shadow: 0 0 10px oklch(0.7 0.22 320 / 0.5);
}
.hero-name {
  font-family: var(--f-title);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.06em;
  margin-bottom: 2px;
}
.hero-title {
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--violet);
  margin-bottom: 12px;
}
.hero-xpbar { margin-bottom: 12px; }
.hero-xp-meta {
  display: flex;
  justify-content: space-between;
  font-family: var(--f-mono);
  font-size: 9px;
  color: var(--text-lo);
  margin-bottom: 4px;
  letter-spacing: 0.08em;
}
.hero-xp-meta span:first-child { font-family: var(--f-title); color: var(--violet); letter-spacing: 0.2em; }
.hero-xp-track {
  height: 8px;
  background: var(--bg-3);
  border: 1px solid var(--border-lo);
  border-radius: 999px;
  overflow: hidden;
  position: relative;
}
.hero-xp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--violet-2), var(--violet), oklch(0.78 0.18 320));
  box-shadow: 0 0 12px var(--violet-glow), inset 0 1px 0 oklch(1 0 0 / 0.2);
  position: relative;
}
.hero-xp-fill::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, oklch(1 0 0 / 0.3), transparent);
  background-size: 60% 100%;
  background-repeat: no-repeat;
  background-position: -60% 0;
  animation: shimmer 2.5s linear infinite;
}
@keyframes shimmer { to { background-position: 160% 0; } }
.hero-counts {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.hc-item { text-align: center; }
.hc-num {
  display: block;
  font-family: var(--f-title);
  font-size: 18px;
  font-weight: 700;
  color: var(--gold);
  line-height: 1;
}
.hc-lbl {
  display: block;
  font-family: var(--f-title);
  font-size: 8px;
  letter-spacing: 0.2em;
  color: var(--text-lo);
  text-transform: uppercase;
  margin-top: 4px;
}
.hc-div {
  width: 1px;
  align-self: stretch;
  background: var(--border);
  margin: 4px 0;
}

/* GOALS */
.goals-panel { padding-bottom: 12px; }
.goal-row { padding: 10px 14px; position: relative; z-index: 1; }
.goal-row + .goal-row { border-top: 1px dashed var(--border-lo); }
.gr-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 5px;
}
.gr-label {
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.18em;
  color: var(--text-md);
  text-transform: uppercase;
}
.gr-val { font-family: var(--f-title); font-size: 13px; font-weight: 700; color: var(--text-hi); }
.gr-val small { font-size: 9px; color: var(--text-lo); font-weight: 400; margin-left: 3px; }
.gr-bar {
  height: 6px;
  background: var(--bg-3);
  border: 1px solid var(--border-lo);
  border-radius: 3px;
  overflow: hidden;
}
.gr-fill { height: 100%; transition: width 0.6s var(--ease-out); }
.gr-fill.gold   { background: linear-gradient(90deg, var(--gold-2), var(--gold));     box-shadow: 0 0 8px var(--gold-glow); }
.gr-fill.violet { background: linear-gradient(90deg, var(--violet-2), var(--violet)); box-shadow: 0 0 8px var(--violet-glow); }
.gr-fill.cyan   { background: linear-gradient(90deg, var(--cyan-2), var(--cyan));     box-shadow: 0 0 8px var(--cyan-glow); }

/* FOCUS CARD */
.focus-card { display: flex; flex-direction: column; }
.focus-active {
  font-family: var(--f-mono);
  font-size: 9px;
  color: var(--mint);
  letter-spacing: 0.06em;
}
.focus-body {
  padding: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  position: relative; z-index: 1;
}
.focus-ring {
  position: relative;
  width: 110px; height: 110px;
  display: flex; align-items: center; justify-content: center;
}
.focus-ring svg { position: absolute; }
.focus-time {
  font-family: var(--f-title);
  font-size: 22px;
  font-weight: 700;
  color: var(--text-hi);
  letter-spacing: 0.05em;
  line-height: 1;
}
.focus-sub {
  font-family: var(--f-title);
  font-size: 8px;
  letter-spacing: 0.25em;
  color: var(--text-lo);
  margin-top: 4px;
  text-transform: uppercase;
}
.focus-quest {
  font-size: 11px;
  color: var(--violet);
  font-style: italic;
  text-align: center;
}
.focus-controls { display: flex; gap: 6px; }
.fc-btn {
  font-family: var(--f-title);
  font-size: 10px;
  letter-spacing: 0.15em;
  font-weight: 700;
  padding: 7px 14px;
  border-radius: 6px;
  border: 1px solid;
  text-transform: uppercase;
  transition: all 0.2s;
}
.fc-btn.primary {
  background: linear-gradient(135deg, var(--violet-2), var(--violet));
  border-color: var(--violet);
  color: #fff;
  box-shadow: 0 0 12px var(--violet-glow);
}
.fc-btn.primary:hover { box-shadow: 0 0 22px var(--violet-glow); transform: translateY(-1px); }
.fc-btn.ghost {
  background: var(--bg-2);
  border-color: var(--border);
  color: var(--text-md);
}
.fc-btn.ghost:hover { color: var(--gold); border-color: var(--gold); }

/* STREAK CARD */
.streak-panel { padding-bottom: 14px; text-align: center; }
.streak-flame {
  font-size: 36px;
  background: linear-gradient(180deg, var(--gold), oklch(0.55 0.20 25));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 12px var(--gold-glow));
  margin: 12px 0 4px;
  animation: flame-flicker 2.4s ease-in-out infinite;
}
@keyframes flame-flicker {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.06) rotate(-1deg); }
}
.streak-num {
  font-family: var(--f-title);
  font-size: 32px;
  font-weight: 800;
  color: var(--gold);
  letter-spacing: 0.04em;
  text-shadow: 0 0 16px var(--gold-glow);
  line-height: 1;
  display: flex;
  justify-content: center;
  align-items: baseline;
  gap: 5px;
}
.streak-num span {
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.25em;
  color: var(--text-lo);
}
.streak-week {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin: 12px 0 8px;
}
.sw-day {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  width: 22px;
}
.sw-glyph {
  width: 18px; height: 18px;
  border-radius: 4px;
  background: var(--bg-3);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px;
  color: var(--text-dim);
}
.sw-day.lit .sw-glyph {
  background: linear-gradient(135deg, var(--gold-2), var(--gold));
  color: #0a0400;
  border-color: var(--gold);
  box-shadow: 0 0 8px var(--gold-glow);
}
.sw-day.today .sw-glyph {
  background: linear-gradient(135deg, var(--violet-2), var(--violet));
  color: #fff;
  border-color: var(--violet);
  box-shadow: 0 0 10px var(--violet-glow);
  animation: pulse-dot 1.8s infinite;
}
.sw-day.future .sw-glyph { color: var(--text-dim); }
.sw-lbl { font-family: var(--f-title); font-size: 8px; color: var(--text-lo); letter-spacing: 0.1em; }
.sw-day.today .sw-lbl { color: var(--violet); }
.streak-msg {
  font-size: 10px;
  color: var(--text-md);
  padding: 0 14px;
  line-height: 1.4;
}
.streak-msg strong { color: var(--gold); font-family: var(--f-title); letter-spacing: 0.06em; }
.streak-msg em { color: var(--violet); font-style: normal; font-family: var(--f-title); letter-spacing: 0.04em; }

/* ── SKELETON ───────────────────────────────────────────── */
.skel-stack { display: flex; flex-direction: column; gap: 10px; }
.skel-card {
  padding: 12px 14px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
}
.skel-card.small { padding: 8px 10px; }
.skel-row { display: flex; align-items: center; gap: 10px; }
.skel-circle, .skel-line {
  background: linear-gradient(90deg, var(--bg-3), var(--bg-4), var(--bg-3));
  background-size: 200% 100%;
  animation: skel 1.4s linear infinite;
  border-radius: 4px;
}
.skel-circle { width: 28px; height: 28px; border-radius: 50%; }
.skel-flex { flex: 1; }
.skel-line { height: 10px; margin-bottom: 6px; }
.skel-line.w60 { width: 60%; }
.skel-line.w40 { width: 40%; }
@keyframes skel { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ── NEW QUEST MODAL ─────────────────────────────────────── */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: oklch(0 0 0 / 0.7);
  backdrop-filter: blur(8px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fade-in 0.25s ease;
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.new-quest-modal {
  position: relative;
  width: 580px;
  max-width: 100%;
  max-height: 90vh;
  background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
  border: 1.5px solid var(--gold);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: 0 0 60px var(--gold-glow), 0 24px 64px oklch(0 0 0 / 0.6);
  animation: modal-slide 0.4s var(--ease-spring);
}
@keyframes modal-slide { from { opacity: 0; transform: scale(0.92) translateY(20px); } to { opacity: 1; transform: scale(1); } }
.nqm-glow {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at top, var(--gold-glow), transparent 60%);
  opacity: 0.4;
  pointer-events: none;
}
.nqm-head {
  padding: 22px 26px 16px;
  border-bottom: 1px solid var(--border);
  text-align: center;
  position: relative;
}
.nqm-eyebrow {
  font-family: var(--f-title);
  font-size: 10px;
  letter-spacing: 0.35em;
  color: var(--gold);
  display: block;
  margin-bottom: 6px;
}
.nqm-title {
  font-family: var(--f-title);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.06em;
  background: linear-gradient(135deg, var(--text-hi), var(--gold));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.nqm-body {
  padding: 18px 26px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-height: 60vh;
  overflow-y: auto;
  position: relative;
}
.nqm-field { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0; }
.nqm-field.small { max-width: 130px; }
.nqm-field label {
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.22em;
  color: var(--text-md);
  text-transform: uppercase;
}
.nqm-field input, .nqm-field textarea {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  color: var(--text-hi);
  outline: none;
  transition: all 0.2s;
  width: 100%;
  resize: none;
}
.nqm-field input:focus, .nqm-field textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px oklch(0.78 0.16 82 / 0.12), 0 0 14px var(--gold-glow);
}
.nqm-row { display: flex; gap: 14px; flex-wrap: wrap; }
.nqm-cats { display: flex; flex-wrap: wrap; gap: 6px; }
.nqm-diffs { display: flex; gap: 6px; }
.nqm-diff {
  flex: 1;
  background: var(--bg-2);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 8px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-family: var(--f-title);
  font-size: 14px;
  font-weight: 900;
  color: var(--text-md);
  transition: all 0.2s;
}
.nqm-diff small { font-family: var(--f-mono); font-size: 8px; color: var(--text-lo); letter-spacing: 0.05em; font-weight: 500; }
.nqm-diff.on { background: var(--surface-3); border-color: currentColor; transform: translateY(-1px); }
.nqm-diff.on.diff-S { color: oklch(0.7 0.22 320); box-shadow: 0 0 12px oklch(0.7 0.22 320 / 0.4); }
.nqm-diff.on.diff-A { color: var(--rose);   box-shadow: 0 0 12px var(--rose-glow); }
.nqm-diff.on.diff-B { color: var(--violet); box-shadow: 0 0 12px var(--violet-glow); }
.nqm-diff.on.diff-C { color: var(--cyan);   box-shadow: 0 0 12px var(--cyan-glow); }
.nqm-diff.on.diff-D { color: var(--gold);   box-shadow: 0 0 12px var(--gold-glow); }
.nqm-reward {
  margin-top: 4px;
  padding: 12px 14px;
  background: linear-gradient(135deg, oklch(0.20 0.15 295 / 0.2), oklch(0.18 0.15 82 / 0.18));
  border: 1px solid oklch(0.78 0.16 82 / 0.4);
  border-radius: var(--r-md);
  box-shadow: inset 0 0 14px oklch(0.78 0.16 82 / 0.08);
}
.nqm-reward-label {
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.25em;
  color: var(--gold);
  margin-bottom: 8px;
}
.nqm-reward-pills {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.reward-large {
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
  font-family: var(--f-title);
  font-size: 18px;
  font-weight: 800;
  padding: 5px 14px;
  border-radius: 999px;
  background: oklch(0 0 0 / 0.3);
  border: 1px solid;
  letter-spacing: 0.02em;
}
.reward-large small {
  font-size: 9px;
  letter-spacing: 0.18em;
  font-weight: 600;
  opacity: 0.7;
}
.reward-large.xp    { color: var(--violet); border-color: oklch(0.68 0.22 295 / 0.5); }
.reward-large.coin  { color: var(--gold);   border-color: oklch(0.78 0.16 82 / 0.5); }
.reward-large.combo { color: var(--rose);   border-color: oklch(0.74 0.18 5 / 0.5); }
.nqm-actions {
  padding: 14px 26px 22px;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  border-top: 1px solid var(--border);
  position: relative;
}

/* ── XP BURST ───────────────────────────────────────────── */
.xp-burst-overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1500;
  display: flex;
  align-items: center;
  justify-content: center;
}
.xpb-toast {
  position: relative;
  padding: 16px 26px;
  background: linear-gradient(135deg, var(--bg-2), var(--bg-3));
  border: 1.5px solid var(--gold);
  border-radius: 16px;
  box-shadow: 0 0 50px var(--gold-glow), 0 12px 40px oklch(0 0 0 / 0.6);
  text-align: center;
  animation: xpb-in 0.45s var(--ease-spring), xpb-out 0.45s ease 2s forwards;
}
@keyframes xpb-in {
  from { opacity: 0; transform: scale(0.5) translateY(40px); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes xpb-out {
  to { opacity: 0; transform: scale(1.1) translateY(-30px); }
}
.xpb-glow {
  position: absolute;
  inset: -2px;
  border-radius: 18px;
  background: radial-gradient(ellipse, var(--gold-glow), transparent 60%);
  filter: blur(20px);
  opacity: 0.6;
  z-index: -1;
}
.xpb-content { position: relative; z-index: 2; }
.xpb-eyebrow {
  font-family: var(--f-title);
  font-size: 10px;
  letter-spacing: 0.35em;
  color: var(--gold);
  margin-bottom: 6px;
}
.xpb-rewards {
  font-family: var(--f-title);
  font-size: 26px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  letter-spacing: 0.04em;
}
.xpb-xp { color: var(--violet); text-shadow: 0 0 16px var(--violet-glow); }
.xpb-coin { color: var(--gold); text-shadow: 0 0 16px var(--gold-glow); }
.xpb-sep { color: var(--text-dim); }
.xpb-combo {
  font-family: var(--f-title);
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--rose);
  margin-top: 4px;
}
.xpb-particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.xpb-p {
  position: absolute;
  top: 50%; left: 50%;
  width: 6px; height: 6px;
  background: var(--gold);
  border-radius: 50%;
  box-shadow: 0 0 12px var(--gold);
  animation: xpb-particle 1.4s ease-out forwards;
  animation-delay: var(--del);
  transform: translate(-50%, -50%) rotate(var(--a)) translateX(var(--d));
  opacity: 0;
}
@keyframes xpb-particle {
  0%   { opacity: 0; transform: translate(-50%, -50%) rotate(var(--a)) translateX(0)        scale(1); }
  20%  { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--a)) translateX(var(--d)) scale(0.3); }
}

/* ACHIEVEMENT TOAST */
.achieve-toast {
  position: fixed;
  top: 90px;
  right: 24px;
  width: 340px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 14px;
  align-items: center;
  padding: 14px 18px;
  background: linear-gradient(135deg, var(--bg-2), oklch(0.18 0.15 82 / 0.5));
  border: 1.5px solid var(--gold);
  border-radius: 12px;
  box-shadow: 0 0 40px var(--gold-glow), 0 16px 40px oklch(0 0 0 / 0.5);
  z-index: 1400;
  overflow: hidden;
  animation: at-in 0.4s var(--ease-spring), at-out 0.4s ease 3.1s forwards;
}
@keyframes at-in  { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
@keyframes at-out { to   { opacity: 0; transform: translateX(40px); } }
.at-medal {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--gold-glow), transparent 70%);
  border: 2px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  box-shadow: 0 0 18px var(--gold-glow);
}
.at-eyebrow {
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.3em;
  color: var(--gold);
  margin-bottom: 2px;
}
.at-title {
  font-family: var(--f-title);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--text-hi);
}
.at-desc {
  font-size: 11px;
  color: var(--text-md);
  margin-top: 2px;
}
.at-shine {
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, transparent 40%, oklch(1 0 0 / 0.08) 50%, transparent 60%);
  background-size: 200% 100%;
  animation: shine 2.4s linear infinite;
  pointer-events: none;
}
@keyframes shine { to { background-position: -200% 0; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
