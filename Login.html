<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aetheria — Gate of Aetheria · Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ── RESET ───────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }

/* ── TOKENS ──────────────────────────────────────────────────────── */
:root {
  --bg-0:        #050510;
  --bg-1:        #0a0a18;
  --bg-2:        #10101f;
  --bg-3:        #16162a;
  --bg-4:        #1f1f38;
  --panel:       #0e0e1c;
  --panel-2:     #14142a;
  --panel-3:     #1b1b34;
  --border:      #2a2a4a;
  --border-hi:   #3a3a64;
  --border-lo:   #1f1f38;

  --gold:        oklch(0.78 0.16 82);
  --gold-deep:   oklch(0.62 0.14 82);
  --gold-glow:   oklch(0.78 0.16 82 / 0.35);
  --violet:      oklch(0.70 0.22 295);
  --violet-deep: oklch(0.50 0.20 295);
  --violet-glow: oklch(0.70 0.22 295 / 0.35);
  --cyan:        oklch(0.80 0.16 205);
  --cyan-glow:   oklch(0.80 0.16 205 / 0.35);
  --mint:        oklch(0.78 0.14 162);
  --mint-glow:   oklch(0.78 0.14 162 / 0.35);
  --rose:        oklch(0.74 0.18 5);
  --rose-glow:   oklch(0.74 0.18 5 / 0.4);
  --crimson:     oklch(0.62 0.24 22);

  --text-hi:     #f0eeff;
  --text-md:     #b4b4d8;
  --text-lo:     #7d7da6;
  --text-dim:    #4a4a6a;

  --f-title:     'Cinzel', serif;
  --f-body:      'Sora', sans-serif;
  --f-mono:      'JetBrains Mono', monospace;

  --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

body {
  background: var(--bg-0);
  color: var(--text-hi);
  font-family: var(--f-body);
  font-size: 13px;
  line-height: 1.5;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
a { color: var(--gold); text-decoration: none; border-bottom: 1px dashed transparent; transition: border-color 0.2s; }
a:hover { border-color: currentColor; }
button { font-family: inherit; cursor: pointer; }
input, textarea { font-family: inherit; color: inherit; }

/* ═══════════════════════════════════════════════════════════════════
   SHELL
═══════════════════════════════════════════════════════════════════ */
.auth-shell {
  display: grid;
  grid-template-columns: minmax(520px, 1.25fr) minmax(460px, 540px);
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  position: relative;
  background: var(--bg-0);
  background-image:
    radial-gradient(ellipse 60% 50% at 18% 22%, oklch(0.36 0.16 270 / 0.45) 0%, transparent 60%),
    radial-gradient(ellipse 80% 60% at 85% 78%, oklch(0.34 0.14 295 / 0.32) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 60% 5%, oklch(0.50 0.12 200 / 0.18) 0%, transparent 60%),
    linear-gradient(180deg, #06061a 0%, #03030c 100%);
}

/* ═══════════════════════════════════════════════════════════════════
   SCENE (left)
═══════════════════════════════════════════════════════════════════ */
.scene {
  position: relative;
  overflow: hidden;
  border-right: 1px solid var(--border-lo);
}

/* Aurora */
.aurora {
  position: absolute;
  inset: -20%;
  filter: blur(60px);
  opacity: 0.6;
  pointer-events: none;
  mix-blend-mode: screen;
}
.aurora.a1 {
  background: radial-gradient(ellipse 40% 50% at 25% 35%, oklch(0.55 0.22 295 / 0.55) 0%, transparent 60%);
  animation: aurora-drift-1 22s ease-in-out infinite alternate;
}
.aurora.a2 {
  background: radial-gradient(ellipse 50% 40% at 70% 70%, oklch(0.55 0.18 200 / 0.40) 0%, transparent 60%);
  animation: aurora-drift-2 28s ease-in-out infinite alternate;
}
.aurora.a3 {
  background: radial-gradient(ellipse 35% 30% at 80% 18%, oklch(0.62 0.16 82 / 0.30) 0%, transparent 60%);
  animation: aurora-drift-3 18s ease-in-out infinite alternate;
}
@keyframes aurora-drift-1 { 0% { transform: translate(0,0); } 100% { transform: translate(40px,-30px); } }
@keyframes aurora-drift-2 { 0% { transform: translate(0,0); } 100% { transform: translate(-50px,40px); } }
@keyframes aurora-drift-3 { 0% { transform: translate(0,0); } 100% { transform: translate(30px,30px); } }

.horizon {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 35%;
  background:
    linear-gradient(180deg, transparent 0%, oklch(0.10 0.05 280 / 0.4) 60%, oklch(0.06 0.02 280) 100%);
  pointer-events: none;
}
.mountains {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  width: 100%;
  height: 32%;
  pointer-events: none;
}

/* stars */
.stars { position: absolute; inset: 0; pointer-events: none; }
.star {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 4px #fff;
  animation: star-twinkle 4.5s ease-in-out infinite;
}
@keyframes star-twinkle {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

/* particles */
.particles { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.mote {
  position: absolute;
  border-radius: 50%;
  animation: mote-float linear infinite;
  filter: blur(0.4px);
}
.mote--gold {
  background: var(--gold);
  box-shadow: 0 0 6px var(--gold-glow), 0 0 12px var(--gold-glow);
}
.mote--violet {
  background: var(--violet);
  box-shadow: 0 0 6px var(--violet-glow), 0 0 12px var(--violet-glow);
}
@keyframes mote-float {
  0%   { transform: translate(0, 0); opacity: 0; }
  10%  { opacity: 0.9; }
  90%  { opacity: 0.9; }
  100% { transform: translate(var(--drift), -180px); opacity: 0; }
}

/* ─── RUNIC GATE ─── */
.runic-gate {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -56%);
  width: min(78%, 640px);
  aspect-ratio: 1;
  pointer-events: none;
  z-index: 2;
}
.rg-outer { width: 100%; height: 100%; animation: gate-rotate-slow 80s linear infinite; }
.rg-c {
  fill: none;
  stroke: oklch(0.78 0.16 82);
  stroke-width: 0.6;
  opacity: 0.4;
}
.rg-c1 { stroke-dasharray: 2 6; opacity: 0.5; }
.rg-c2 { stroke-dasharray: 1 3; stroke: oklch(0.70 0.22 295); opacity: 0.6; }
.rg-c3 { stroke-width: 1.2; opacity: 0.6; }
.rg-c4 { stroke-dasharray: 4 4; stroke: oklch(0.78 0.16 82); opacity: 0.7; }
.rg-tick { stroke: oklch(0.78 0.16 82); stroke-width: 0.6; opacity: 0.4; }
.rg-tick-major { stroke-width: 1.2; opacity: 0.8; }
.rg-text-outer {
  fill: oklch(0.78 0.16 82);
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.2em;
  opacity: 0.55;
}
.rg-text-inner {
  fill: oklch(0.70 0.22 295);
  font-family: var(--f-title);
  font-size: 11px;
  letter-spacing: 0.3em;
  opacity: 0.45;
}
.rg-sigil-bg {
  fill: oklch(0.10 0.05 280);
  stroke: oklch(0.78 0.16 82);
  stroke-width: 0.6;
}
.rg-sigil {
  fill: oklch(0.78 0.16 82);
  font-size: 11px;
  text-anchor: middle;
  dominant-baseline: middle;
  transform: translate(0, 0.5px);
}
.rg-hex {
  fill: none;
  stroke: oklch(0.70 0.22 295);
  stroke-width: 0.5;
  stroke-dasharray: 3 3;
  opacity: 0.4;
}
.runic-gate.is-pulse .rg-outer { animation: gate-rotate-slow 40s linear infinite, gate-pulse 1.4s ease-out infinite; }
@keyframes gate-rotate-slow { to { transform: rotate(360deg); } }
@keyframes gate-pulse {
  0%, 100% { filter: drop-shadow(0 0 8px var(--gold-glow)); }
  50%      { filter: drop-shadow(0 0 28px var(--gold-glow)) drop-shadow(0 0 56px var(--gold-glow)); }
}

/* ─── CHARACTER ─── */
.char-stage {
  position: absolute;
  left: 50%;
  bottom: 8%;
  transform: translateX(-50%);
  width: 240px;
  height: 320px;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
}
.char-glow {
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 200px;
  height: 50px;
  background: radial-gradient(ellipse, var(--violet-glow), transparent 60%);
  filter: blur(8px);
}
.char-silhouette {
  width: 220px;
  height: 300px;
  position: relative;
  animation: char-breathe 5s ease-in-out infinite;
}
.char-silhouette svg { width: 100%; height: 100%; filter: drop-shadow(0 0 20px var(--violet-glow)); }
@keyframes char-breathe {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}
.char-cap {
  position: absolute;
  bottom: -20px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--f-mono);
  font-size: 9px;
  letter-spacing: 0.3em;
  color: var(--text-dim);
  white-space: nowrap;
  border: 1px dashed var(--border);
  padding: 3px 8px;
  border-radius: 2px;
  background: oklch(0 0 0 / 0.4);
}

/* ─── WORLD MARK ─── */
.world-mark {
  position: absolute;
  left: 8%;
  top: 9%;
  z-index: 5;
  max-width: 360px;
}
.wm-brand-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.wm-brand {
  font-family: var(--f-title);
  font-size: 38px;
  font-weight: 900;
  letter-spacing: 0.32em;
  background: linear-gradient(135deg, var(--gold) 0%, #fff 45%, var(--violet) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: 0 0 30px var(--gold-glow);
}
.wm-glyph {
  color: var(--gold);
  font-size: 18px;
  filter: drop-shadow(0 0 6px var(--gold-glow));
  animation: glyph-spin 12s linear infinite;
}
@keyframes glyph-spin { to { transform: rotate(360deg); } }
.wm-subtitle {
  font-family: var(--f-title);
  font-size: 9.5px;
  letter-spacing: 0.42em;
  color: var(--gold);
  margin-top: 8px;
  opacity: 0.85;
}
.wm-divider {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 14px 0 12px;
}
.wm-divider span:not(.wm-dia) {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-hi), transparent);
  max-width: 80px;
}
.wm-dia {
  width: 5px; height: 5px;
  background: var(--gold);
  transform: rotate(45deg);
  box-shadow: 0 0 8px var(--gold-glow);
}
.wm-tagline {
  font-family: var(--f-body);
  font-size: 12px;
  color: var(--text-md);
  font-style: italic;
  line-height: 1.65;
  letter-spacing: 0.02em;
  max-width: 320px;
}

/* ─── FLOATING LORE CARDS ─── */
.float-card {
  position: absolute;
  background: linear-gradient(180deg, oklch(0.10 0.05 280 / 0.78), oklch(0.06 0.03 280 / 0.78));
  border: 1px solid oklch(0.78 0.16 82 / 0.28);
  border-radius: 8px;
  padding: 14px 16px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 6;
  box-shadow: 0 8px 32px oklch(0 0 0 / 0.6), 0 0 24px oklch(0.78 0.16 82 / 0.08);
  animation: card-float 7s ease-in-out infinite;
  font-size: 11px;
}
.fc-realm   { top: 36%; right: 6%; width: 220px; animation-delay: -1s; }
.fc-news    { bottom: 8%; right: 5%; width: 230px; animation-delay: -3s; }
.fc-creed   {
  bottom: 26%; left: 6%; width: 280px;
  animation-delay: -5s;
  background: linear-gradient(135deg, oklch(0.10 0.06 290 / 0.85), oklch(0.05 0.03 280 / 0.85));
  border-color: oklch(0.70 0.22 295 / 0.35);
}
@keyframes card-float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-8px); }
}
.fc-corner {
  position: absolute;
  width: 10px; height: 10px;
  pointer-events: none;
}
.fc-corner.tl { top: -1px; left: -1px; border-top: 1.5px solid var(--gold); border-left: 1.5px solid var(--gold); }
.fc-corner.tr { top: -1px; right: -1px; border-top: 1.5px solid var(--gold); border-right: 1.5px solid var(--gold); }
.fc-corner.bl { bottom: -1px; left: -1px; border-bottom: 1.5px solid var(--gold); border-left: 1.5px solid var(--gold); }
.fc-corner.br { bottom: -1px; right: -1px; border-bottom: 1.5px solid var(--gold); border-right: 1.5px solid var(--gold); }
.fc-tag {
  font-family: var(--f-title);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.3em;
  color: var(--gold);
  margin-bottom: 10px;
  text-transform: uppercase;
}
.fc-tag.violet { color: var(--violet); }
.fc-tag.gold-tag { color: var(--gold); text-align: center; }
.fc-row {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  border-bottom: 1px dashed oklch(0.78 0.16 82 / 0.15);
  font-size: 10.5px;
}
.fc-row:last-of-type { border-bottom: none; }
.fc-k { color: var(--text-md); letter-spacing: 0.04em; }
.fc-v { color: var(--text-hi); font-family: var(--f-mono); font-weight: 600; }
.fc-v.gold { color: var(--gold); }
.fc-bar {
  margin-top: 10px;
  height: 4px;
  background: var(--bg-3);
  border-radius: 2px;
  border: 1px solid var(--border-lo);
  overflow: hidden;
}
.fc-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-deep), var(--gold));
  box-shadow: 0 0 6px var(--gold-glow);
  border-radius: inherit;
}
.fc-foot {
  margin-top: 6px;
  font-family: var(--f-mono);
  font-size: 8.5px;
  color: var(--text-dim);
  letter-spacing: 0.15em;
}
.fc-news-head {
  font-family: var(--f-title);
  font-size: 13px;
  color: var(--text-hi);
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}
.fc-news-body {
  font-size: 11px;
  color: var(--text-md);
  line-height: 1.55;
}
.fc-news-body em { color: var(--violet); font-style: normal; font-weight: 600; }
.fc-news-meta {
  margin-top: 8px;
  font-family: var(--f-mono);
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 0.1em;
}
.fc-creed-text {
  font-family: var(--f-body);
  font-size: 12px;
  font-style: italic;
  color: var(--text-hi);
  line-height: 1.7;
  text-align: center;
  letter-spacing: 0.01em;
}

/* ─── COMPANION ─── */
.companion {
  position: absolute;
  bottom: 5%;
  right: 4%;
  width: 88px;
  z-index: 8;
  animation: comp-bob 3.2s ease-in-out infinite;
}
@keyframes comp-bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-10px); }
}
.comp-bubble {
  position: absolute;
  bottom: 100%;
  right: -4px;
  margin-bottom: 6px;
  background: linear-gradient(180deg, oklch(0.12 0.05 290 / 0.94), oklch(0.06 0.03 280 / 0.94));
  border: 1px solid var(--violet);
  border-radius: 10px 10px 2px 10px;
  padding: 8px 12px;
  width: 200px;
  box-shadow: 0 6px 20px oklch(0 0 0 / 0.6), 0 0 18px var(--violet-glow);
}
.comp-bubble-inner {
  font-size: 11px;
  color: var(--text-hi);
  line-height: 1.4;
  font-style: italic;
}
.comp-bubble::after {
  content: '';
  position: absolute;
  right: 14px;
  bottom: -6px;
  width: 10px; height: 10px;
  background: oklch(0.12 0.05 290 / 0.94);
  border-right: 1px solid var(--violet);
  border-bottom: 1px solid var(--violet);
  transform: rotate(45deg);
}
.comp-shadow {
  position: absolute;
  bottom: -8px; left: 50%;
  transform: translateX(-50%);
  width: 70%;
  height: 8px;
  background: radial-gradient(ellipse, oklch(0 0 0 / 0.5), transparent 70%);
  filter: blur(4px);
}
.comp-body {
  position: relative;
  width: 88px;
  height: 88px;
  filter: drop-shadow(0 0 12px var(--violet-glow));
}
.comp-aura {
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--violet-glow), transparent 60%);
  animation: comp-aura-pulse 2.4s ease-in-out infinite;
}
@keyframes comp-aura-pulse {
  0%, 100% { opacity: 0.7; transform: scale(1); }
  50%      { opacity: 1; transform: scale(1.12); }
}
.comp-svg { width: 100%; height: 100%; position: relative; z-index: 2; }
.comp-name {
  margin-top: 4px;
  text-align: center;
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--violet);
}
.comp-name span {
  margin: 0 4px;
  color: var(--text-dim);
}
.companion.mood-angry .comp-body { filter: drop-shadow(0 0 14px var(--rose-glow)); animation: comp-shake 0.2s ease-in-out infinite; }
.companion.mood-angry .comp-aura { background: radial-gradient(circle, var(--rose-glow), transparent 60%); }
.companion.mood-angry .comp-bubble { border-color: var(--rose); box-shadow: 0 0 18px var(--rose-glow); }
.companion.mood-angry .comp-bubble::after { border-color: var(--rose); }
.companion.mood-angry .comp-mouth { d: path("M35 49 Q40 45 45 49"); }
.companion.mood-happy .comp-body { filter: drop-shadow(0 0 16px var(--gold-glow)); }
.companion.mood-happy .comp-aura { background: radial-gradient(circle, var(--gold-glow), transparent 60%); }
.companion.mood-happy .comp-bubble { border-color: var(--gold); box-shadow: 0 0 18px var(--gold-glow); }
.companion.mood-happy .comp-bubble::after { border-color: var(--gold); }
.companion.mood-focused .comp-eyes { transform: scaleY(0.4); transform-origin: center; }
@keyframes comp-shake {
  0%, 100% { transform: translate(0,0); }
  25%      { transform: translate(-2px,1px); }
  75%      { transform: translate(2px,-1px); }
}

/* ═══════════════════════════════════════════════════════════════════
   AUTH SIDE (right)
═══════════════════════════════════════════════════════════════════ */
.auth-side {
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, oklch(0.07 0.03 280 / 0.6) 0%, oklch(0.04 0.02 280 / 0.6) 100%);
  position: relative;
  overflow-y: auto;
  border-left: 1px solid var(--border-lo);
}
.auth-side::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    repeating-linear-gradient(0deg,  transparent, transparent 30px, oklch(1 0 0 / 0.014) 30px, oklch(1 0 0 / 0.014) 31px),
    repeating-linear-gradient(90deg, transparent, transparent 30px, oklch(1 0 0 / 0.014) 30px, oklch(1 0 0 / 0.014) 31px);
  pointer-events: none;
}

.side-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 36px 0;
  position: relative;
  z-index: 2;
}
.brand-mini { display: flex; align-items: center; gap: 10px; }
.bm-mark {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--gold-deep), var(--gold) 55%, var(--violet));
  display: flex; align-items: center; justify-content: center;
  font-family: var(--f-title);
  font-weight: 900;
  font-size: 18px;
  color: #0a0400;
  box-shadow: 0 0 20px var(--gold-glow), inset 0 0 8px oklch(1 0 0 / 0.2);
}
.bm-name {
  font-family: var(--f-title);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.24em;
  background: linear-gradient(90deg, var(--gold), var(--violet));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.bm-tag {
  font-family: var(--f-mono);
  font-size: 8.5px;
  color: var(--text-dim);
  letter-spacing: 0.22em;
  margin-top: 2px;
}
.lang-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: oklch(0 0 0 / 0.3);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 4px 10px;
  font-family: var(--f-mono);
  font-size: 9px;
  letter-spacing: 0.18em;
  color: var(--text-md);
  cursor: pointer;
  transition: all 0.2s;
}
.lang-pill:hover { border-color: var(--gold); color: var(--gold); }
.lang-pill .ico { color: var(--gold); }

/* ═══════════════════════════════════════════════════════════════════
   AUTH PANEL
═══════════════════════════════════════════════════════════════════ */
.auth-panel {
  margin: 24px 36px 0;
  padding: 26px 30px 28px;
  background: linear-gradient(180deg, oklch(0.09 0.04 280 / 0.85), oklch(0.05 0.02 280 / 0.85));
  border: 1px solid var(--border);
  border-radius: 14px;
  position: relative;
  z-index: 2;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow:
    0 24px 64px oklch(0 0 0 / 0.5),
    inset 0 1px 0 oklch(1 0 0 / 0.04),
    0 0 0 1px oklch(0.78 0.16 82 / 0.06);
}
.auth-panel.is-shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shake {
  0%, 100%    { transform: translateX(0); }
  10%, 30%, 50%, 70%, 90% { transform: translateX(-6px); }
  20%, 40%, 60%, 80%       { transform: translateX(6px); }
}
.ap-corner {
  position: absolute;
  width: 14px; height: 14px;
  pointer-events: none;
}
.ap-corner.tl { top: 6px; left: 6px; border-top: 1.5px solid var(--gold); border-left: 1.5px solid var(--gold); }
.ap-corner.tr { top: 6px; right: 6px; border-top: 1.5px solid var(--gold); border-right: 1.5px solid var(--gold); }
.ap-corner.bl { bottom: 6px; left: 6px; border-bottom: 1.5px solid var(--gold); border-left: 1.5px solid var(--gold); }
.ap-corner.br { bottom: 6px; right: 6px; border-bottom: 1.5px solid var(--gold); border-right: 1.5px solid var(--gold); }
.ap-edge {
  position: absolute;
  left: 20%; right: 20%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent);
  opacity: 0.7;
  pointer-events: none;
}
.ap-edge.edge-t { top: 0; }
.ap-edge.edge-b { bottom: 0; }
.ap-shimmer {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  overflow: hidden;
  pointer-events: none;
}
.ap-shimmer::after {
  content: '';
  position: absolute;
  top: 0; left: -60%;
  width: 60%; height: 100%;
  background: linear-gradient(100deg, transparent 30%, oklch(1 0 0 / 0.04) 50%, transparent 70%);
  animation: panel-shimmer 6s ease-in-out infinite;
}
@keyframes panel-shimmer {
  0%, 100% { left: -60%; }
  50%      { left: 120%; }
}

.ap-head {
  text-align: center;
  margin-bottom: 16px;
  position: relative;
}
.ap-tag {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-family: var(--f-title);
  font-size: 9.5px;
  letter-spacing: 0.42em;
  color: var(--gold);
  margin-bottom: 12px;
  text-transform: uppercase;
}
.ap-tag-deco { color: var(--gold); opacity: 0.8; }
.ap-tag-deco.flip { transform: scaleX(-1); }
.ap-title {
  font-family: var(--f-title);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 0.04em;
  line-height: 1.1;
  background: linear-gradient(135deg, var(--text-hi) 0%, var(--gold) 60%, var(--violet) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.ap-sub {
  margin-top: 8px;
  font-size: 12px;
  color: var(--text-md);
  line-height: 1.55;
  max-width: 380px;
  margin-left: auto;
  margin-right: auto;
}

/* ─── MODE TOGGLE ─── */
.mode-toggle {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  background: oklch(0 0 0 / 0.3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 5px;
  margin: 0 0 22px;
}
.mt-btn {
  position: relative;
  z-index: 2;
  background: transparent;
  border: none;
  color: var(--text-lo);
  padding: 8px 14px;
  border-radius: 7px;
  font-family: var(--f-title);
  font-size: 11px;
  letter-spacing: 0.22em;
  font-weight: 700;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex-wrap: wrap;
  transition: color 0.3s var(--ease-out);
}
.mt-btn:hover { color: var(--text-md); }
.mt-btn .mt-glyph { font-size: 12px; }
.mt-btn .mt-sub {
  width: 100%;
  text-align: center;
  font-family: var(--f-mono);
  font-size: 8px;
  letter-spacing: 0.18em;
  color: var(--text-dim);
  text-transform: uppercase;
  font-weight: 400;
}
.mt-btn.active { color: #0a0400; }
.mt-btn.active .mt-sub { color: oklch(0.30 0.10 80); }
.mt-indicator {
  position: absolute;
  z-index: 1;
  top: 5px;
  bottom: 5px;
  width: calc(50% - 5px);
  background: linear-gradient(135deg, var(--gold-deep), var(--gold));
  border-radius: 7px;
  box-shadow: 0 0 16px var(--gold-glow), inset 0 0 6px oklch(1 0 0 / 0.2);
  transition: transform 0.42s var(--ease-spring);
}
.mt-indicator.pos-login { transform: translateX(0); left: 5px; }
.mt-indicator.pos-register { transform: translateX(100%); left: 5px; }

/* ─── FIELDS ─── */
.ap-body {
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: relative;
  z-index: 2;
}
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.field {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.field-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.28em;
  font-weight: 600;
  color: var(--text-md);
  text-transform: uppercase;
}
.fl-ico { color: var(--gold); font-size: 11px; }
.fl-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border), transparent);
  opacity: 0.6;
}
.field-wrap {
  position: relative;
  display: flex;
  align-items: center;
  background: oklch(0 0 0 / 0.45);
  border: 1px solid var(--border);
  border-radius: 8px;
  transition: all 0.25s var(--ease-out);
  overflow: hidden;
}
.field-wrap::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(135deg, transparent, oklch(0.78 0.16 82 / 0.06));
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.field.is-focus .field-wrap {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px oklch(0.78 0.16 82 / 0.18), 0 0 20px var(--gold-glow), inset 0 0 12px oklch(0.78 0.16 82 / 0.06);
}
.field.is-focus .field-wrap::before { opacity: 1; }
.field.is-error .field-wrap {
  border-color: var(--rose);
  box-shadow: 0 0 0 3px oklch(0.74 0.18 5 / 0.18), 0 0 20px var(--rose-glow);
  animation: shake-input 0.4s cubic-bezier(.36,.07,.19,.97);
}
@keyframes shake-input {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-4px); }
  40%, 80% { transform: translateX(4px); }
}
.field-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  padding: 12px 14px;
  font-size: 13px;
  color: var(--text-hi);
  font-family: var(--f-body);
  letter-spacing: 0.02em;
  position: relative;
  z-index: 2;
}
.field-input::placeholder { color: var(--text-dim); }
.field-trailing {
  padding-right: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  position: relative;
  z-index: 2;
}
.field-eye {
  background: none;
  border: none;
  color: var(--text-lo);
  font-size: 14px;
  padding: 4px;
  transition: color 0.2s;
}
.field-eye:hover { color: var(--gold); }
.field-pip {
  font-family: var(--f-title);
  font-size: 8.5px;
  letter-spacing: 0.18em;
  padding: 3px 8px;
  border-radius: 999px;
  background: oklch(0.78 0.14 162 / 0.15);
  color: var(--mint);
  border: 1px solid oklch(0.78 0.14 162 / 0.4);
}
.field-chev { color: var(--text-md); font-size: 10px; }
.field-glow {
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  pointer-events: none;
}
.field-runes {
  position: absolute;
  top: 50%;
  right: 16px;
  transform: translateY(-50%);
  display: flex;
  gap: 4px;
  font-family: var(--f-title);
  font-size: 11px;
  color: var(--gold);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
}
.field.is-focus .field-runes { opacity: 0.4; }
.field.is-focus .field-runes span { animation: rune-fade 1.8s ease-in-out infinite; }
.field-runes span { animation-delay: calc(var(--i) * 0.18s); }
@keyframes rune-fade {
  0%, 100% { opacity: 0.2; transform: translateY(0); }
  50%      { opacity: 1; transform: translateY(-2px); }
}

.field-err {
  font-family: var(--f-mono);
  font-size: 10px;
  color: var(--rose);
  letter-spacing: 0.06em;
  padding: 0 4px;
  display: flex;
  align-items: center;
  gap: 4px;
  animation: err-in 0.3s var(--ease-out);
}
@keyframes err-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

/* ─── ROW BETWEEN ─── */
.row-between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: -2px;
  flex-wrap: wrap;
}
.check-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--f-title);
  font-size: 10px;
  letter-spacing: 0.16em;
  color: var(--text-md);
  text-transform: uppercase;
  cursor: pointer;
  user-select: none;
}
.check-pill input { display: none; }
.check-pill small { color: var(--text-dim); font-size: 9px; letter-spacing: 0.12em; font-weight: 400; }
.check-box {
  width: 16px; height: 16px;
  border: 1.5px solid var(--border-hi);
  border-radius: 4px;
  background: oklch(0 0 0 / 0.5);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: transparent;
  transition: all 0.2s var(--ease-spring);
}
.check-pill input:checked + .check-box,
.terms input:checked + .check-box {
  background: linear-gradient(135deg, var(--gold-deep), var(--gold));
  border-color: var(--gold);
  color: #0a0400;
  box-shadow: 0 0 10px var(--gold-glow);
}
.check-mark { font-weight: 800; font-size: 11px; }
.check-pill:hover .check-box,
.terms:hover .check-box { border-color: var(--gold); }
.terms {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 11px;
  line-height: 1.5;
  color: var(--text-md);
  cursor: pointer;
  margin-top: -2px;
}
.terms input { display: none; }
.check-box.sq { margin-top: 1px; flex-shrink: 0; }
.terms a { color: var(--gold); border-bottom: 1px solid oklch(0.78 0.16 82 / 0.3); }

.link-btn {
  background: none;
  border: none;
  color: var(--violet);
  font-family: var(--f-body);
  font-size: 11px;
  cursor: pointer;
  letter-spacing: 0.04em;
  border-bottom: 1px dashed transparent;
  transition: all 0.2s;
}
.link-btn:hover { color: var(--gold); border-color: var(--gold); }
.link-btn.center { display: block; margin: 8px auto 0; text-align: center; }
.link-btn.inline { display: inline; font-size: inherit; }

/* ─── PRIMARY BUTTON ─── */
.primary-btn {
  position: relative;
  width: 100%;
  background: linear-gradient(135deg, var(--gold-deep), var(--gold));
  border: 1px solid var(--gold);
  border-radius: 10px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  font-family: var(--f-title);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.32em;
  color: #0a0400;
  text-transform: uppercase;
  cursor: pointer;
  margin-top: 4px;
  box-shadow: 0 0 24px var(--gold-glow), inset 0 0 8px oklch(1 0 0 / 0.25), 0 8px 24px oklch(0 0 0 / 0.4);
  overflow: hidden;
  transition: all 0.3s var(--ease-out);
}
.primary-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 0 36px var(--gold-glow), 0 0 56px var(--gold-glow), inset 0 0 8px oklch(1 0 0 / 0.3), 0 12px 28px oklch(0 0 0 / 0.5);
}
.primary-btn:active { transform: translateY(0); filter: brightness(0.95); }
.primary-btn.is-loading {
  pointer-events: none;
  background: linear-gradient(135deg, var(--bg-3), var(--bg-4));
  color: var(--gold);
  border-color: var(--gold);
}
.primary-btn.is-success {
  background: linear-gradient(135deg, oklch(0.55 0.16 162), var(--mint));
  border-color: var(--mint);
  color: #021;
  box-shadow: 0 0 32px var(--mint-glow), inset 0 0 8px oklch(1 0 0 / 0.3);
}
.pb-ornament { font-size: 14px; opacity: 0.6; }
.pb-text { z-index: 2; position: relative; }
.pb-shine {
  position: absolute;
  top: 0; left: -100%;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, oklch(1 0 0 / 0.35), transparent);
  animation: shine 3.5s ease-in-out infinite;
  pointer-events: none;
}
@keyframes shine { 0%, 100% { left: -100%; } 50% { left: 200%; } }
.pb-loader {
  position: absolute;
  width: 16px; height: 16px;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: pb-spin 0.7s linear infinite;
  margin-left: 8px;
}
@keyframes pb-spin { to { transform: rotate(360deg); } }

/* ─── POWER METER ─── */
.power {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px 12px;
  background: oklch(0 0 0 / 0.3);
  border: 1px solid var(--border-lo);
  border-radius: 8px;
}
.power-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.power-tag {
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.28em;
  color: var(--text-md);
}
.power-rank {
  font-family: var(--f-title);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.08em;
}
.power-rank small { font-size: 9px; margin-left: 6px; letter-spacing: 0.2em; opacity: 0.7; }
.rank-rose { color: var(--rose); }
.rank-gold { color: var(--gold); }
.rank-mint { color: var(--mint); }
.rank-violet { color: var(--violet); }
.rank-none { color: var(--text-dim); }
.power-bar {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
}
.power-cell {
  height: 6px;
  background: var(--bg-3);
  border: 1px solid var(--border-lo);
  border-radius: 3px;
  position: relative;
  overflow: hidden;
  transition: all 0.4s var(--ease-spring);
}
.power-cell.lit { background: var(--gold); box-shadow: 0 0 8px var(--gold-glow); border-color: var(--gold); }
.power-cell.lit.color-rose   { background: var(--rose); box-shadow: 0 0 8px var(--rose-glow); border-color: var(--rose); }
.power-cell.lit.color-mint   { background: var(--mint); box-shadow: 0 0 8px var(--mint-glow); border-color: var(--mint); }
.power-cell.lit.color-violet { background: var(--violet); box-shadow: 0 0 8px var(--violet-glow); border-color: var(--violet); }
.power-check {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 12px;
}
.chk {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  color: var(--text-lo);
  font-family: var(--f-mono);
  letter-spacing: 0.04em;
  transition: color 0.3s;
}
.chk.on { color: var(--mint); }
.chk-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 12px;
  font-weight: 700;
}
.chk.on .chk-mark { color: var(--mint); }

/* ─── STONES ─── */
.stones { margin-top: 10px; }
.stones-rule {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.stones-rule::before, .stones-rule::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
}
.stones-rule span {
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.32em;
  color: var(--text-lo);
}
.stones-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.stone {
  position: relative;
  height: 46px;
  background: linear-gradient(180deg, oklch(0.12 0.05 280 / 0.7), oklch(0.06 0.02 280 / 0.7));
  border: 1px solid var(--border);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-hi);
  font-size: 18px;
  cursor: pointer;
  overflow: hidden;
  transition: all 0.25s var(--ease-out);
}
.stone::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 30% 30%, oklch(1 0 0 / 0.06), transparent 70%);
  pointer-events: none;
}
.stone-shimmer {
  position: absolute;
  top: 0; left: -100%;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, oklch(1 0 0 / 0.2), transparent);
  transition: left 0.6s var(--ease-out);
  pointer-events: none;
}
.stone:hover .stone-shimmer { left: 200%; }
.stone:hover { transform: translateY(-2px); }
.stone-cyan:hover   { border-color: var(--cyan); box-shadow: 0 0 18px var(--cyan-glow); }
.stone-violet:hover { border-color: var(--violet); box-shadow: 0 0 18px var(--violet-glow); }
.stone-gold:hover   { border-color: var(--gold); box-shadow: 0 0 18px var(--gold-glow); }
.stone-mint:hover   { border-color: var(--mint); box-shadow: 0 0 18px var(--mint-glow); }
.stone-glyph { display: flex; align-items: center; }

/* ─── SYSTEM ALERT ─── */
.sysalert {
  position: relative;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 4px;
  overflow: hidden;
  animation: alert-in 0.4s var(--ease-spring);
}
@keyframes alert-in {
  from { opacity: 0; transform: translateY(-8px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.sysalert.kind-error {
  background: linear-gradient(135deg, oklch(0.20 0.16 22 / 0.6), oklch(0.10 0.08 22 / 0.6));
  border: 1px solid var(--rose);
  box-shadow: 0 0 20px var(--rose-glow), inset 0 0 12px oklch(0.74 0.18 5 / 0.06);
}
.sysalert.kind-warn {
  background: linear-gradient(135deg, oklch(0.20 0.16 65 / 0.5), oklch(0.10 0.08 65 / 0.5));
  border: 1px solid oklch(0.78 0.16 65);
  box-shadow: 0 0 18px oklch(0.78 0.16 65 / 0.3);
}
.sysalert.kind-success {
  background: linear-gradient(135deg, oklch(0.20 0.14 162 / 0.5), oklch(0.10 0.08 162 / 0.5));
  border: 1px solid var(--mint);
  box-shadow: 0 0 18px var(--mint-glow);
}
.sysalert.kind-info {
  background: linear-gradient(135deg, oklch(0.20 0.14 205 / 0.5), oklch(0.10 0.08 205 / 0.5));
  border: 1px solid var(--cyan);
  box-shadow: 0 0 18px var(--cyan-glow);
}
.sa-stripes {
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(45deg,
    transparent 0, transparent 16px,
    oklch(1 0 0 / 0.03) 16px, oklch(1 0 0 / 0.03) 32px);
  pointer-events: none;
}
.sa-icon {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  background: oklch(0 0 0 / 0.4);
  border: 1px solid currentColor;
}
.sysalert.kind-error .sa-icon { color: var(--rose); }
.sysalert.kind-warn .sa-icon { color: oklch(0.78 0.16 65); }
.sysalert.kind-success .sa-icon { color: var(--mint); }
.sysalert.kind-info .sa-icon { color: var(--cyan); }
.sa-text { flex: 1; position: relative; z-index: 2; }
.sa-title {
  font-family: var(--f-title);
  font-size: 11px;
  letter-spacing: 0.24em;
  font-weight: 700;
  color: var(--text-hi);
  margin-bottom: 2px;
}
.sa-body {
  font-size: 11px;
  color: var(--text-md);
  line-height: 1.5;
}
.sa-body a, .sa-body b { color: var(--text-hi); font-weight: 600; }
.sa-glitch { display: none; }

/* ─── RECOVER ─── */
.recover-art {
  position: relative;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
}
.ra-orb {
  position: absolute;
  width: 90px; height: 90px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--violet-glow), transparent 65%);
  filter: blur(8px);
  animation: orb-pulse 3s ease-in-out infinite;
}
@keyframes orb-pulse {
  0%, 100% { opacity: 0.7; transform: scale(1); }
  50%      { opacity: 1; transform: scale(1.15); }
}
.ra-raven {
  position: relative;
  width: 140px;
  height: auto;
  filter: drop-shadow(0 0 10px var(--violet-glow));
  animation: raven-fly 6s ease-in-out infinite;
}
@keyframes raven-fly {
  0%, 100% { transform: translateX(0) translateY(0); }
  50%      { transform: translateX(8px) translateY(-4px); }
}
.recover-note {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 12px;
  background: oklch(0.70 0.22 295 / 0.06);
  border: 1px solid oklch(0.70 0.22 295 / 0.3);
  border-left-width: 3px;
  border-radius: 6px;
  font-size: 11px;
  color: var(--text-md);
  line-height: 1.55;
}
.rn-ico { color: var(--violet); font-size: 12px; }

/* ─── VERIFY ─── */
.verify-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  align-items: baseline;
  font-size: 11px;
  color: var(--text-md);
  padding-bottom: 8px;
  border-bottom: 1px dashed var(--border-lo);
}
.verify-meta b { color: var(--text-hi); font-weight: 600; }
.vm-timer {
  margin-left: auto;
  font-family: var(--f-title);
  font-size: 9.5px;
  letter-spacing: 0.22em;
  color: var(--gold);
}
.vm-timer b { color: var(--gold); font-family: var(--f-mono); letter-spacing: 0; }
.otp-row {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
  margin: 6px 0 4px;
}
.otp-cell {
  aspect-ratio: 1;
  background: oklch(0 0 0 / 0.45);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  text-align: center;
  font-family: var(--f-title);
  font-size: 26px;
  font-weight: 700;
  color: var(--gold);
  outline: none;
  transition: all 0.25s var(--ease-out);
  text-shadow: 0 0 12px var(--gold-glow);
}
.otp-cell:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px oklch(0.78 0.16 82 / 0.18), 0 0 18px var(--gold-glow);
  transform: translateY(-1px);
}
.otp-cell.filled { background: oklch(0.78 0.16 82 / 0.06); }
.verify-help {
  font-size: 10.5px;
  color: var(--text-lo);
  text-align: center;
  margin-top: 4px;
}

/* ─── PANEL FOOT ─── */
.ap-foot {
  margin-top: 22px;
  padding-top: 14px;
  border-top: 1px dashed var(--border-lo);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  font-family: var(--f-mono);
  font-size: 9px;
  letter-spacing: 0.18em;
  color: var(--text-dim);
  position: relative;
  z-index: 2;
}
.ap-foot .dot { color: var(--gold); opacity: 0.6; }
.ap-foot a { color: var(--text-lo); border-bottom: 1px dashed transparent; }
.ap-foot a:hover { color: var(--gold); }

/* ─── SIDE BOTTOM ─── */
.side-bottom {
  padding: 18px 36px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  position: relative;
  z-index: 2;
  margin-top: auto;
}
.sb-left {
  font-size: 11px;
  color: var(--text-md);
}
.sb-left a {
  color: var(--gold);
  font-family: var(--f-title);
  letter-spacing: 0.16em;
  font-size: 10px;
  font-weight: 600;
}
.sb-right {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--f-title);
  font-size: 9px;
  letter-spacing: 0.22em;
  color: var(--text-lo);
}
.sb-right .sep { color: var(--text-dim); }

/* ═══════════════════════════════════════════════════════════════════
   PORTAL TRANSITION
═══════════════════════════════════════════════════════════════════ */
.is-portal { isolation: isolate; }
.portal-overlay {
  position: absolute;
  inset: -2px;
  border-radius: inherit;
  background: radial-gradient(circle at center, oklch(0.20 0.10 280 / 0.96), oklch(0.05 0.02 280 / 0.98));
  z-index: 10;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: portal-fade 0.5s ease;
}
@keyframes portal-fade { from { opacity: 0; } to { opacity: 1; } }
.portal-ring {
  position: absolute;
  border-radius: 50%;
  border: 2px solid var(--gold);
  box-shadow: 0 0 30px var(--gold-glow), inset 0 0 30px var(--gold-glow);
}
.portal-ring.r1 { width: 70%; height: 70%; animation: portal-grow 1.6s ease-out infinite; }
.portal-ring.r2 { width: 50%; height: 50%; border-color: var(--violet); box-shadow: 0 0 30px var(--violet-glow), inset 0 0 30px var(--violet-glow); animation: portal-grow 1.6s ease-out 0.3s infinite; }
.portal-ring.r3 { width: 30%; height: 30%; border-color: var(--cyan); box-shadow: 0 0 30px var(--cyan-glow), inset 0 0 30px var(--cyan-glow); animation: portal-grow 1.6s ease-out 0.6s infinite; }
@keyframes portal-grow {
  0%   { transform: scale(0.6); opacity: 1; }
  100% { transform: scale(1.4); opacity: 0; }
}
.portal-core {
  position: absolute;
  width: 12%; height: 12%;
  border-radius: 50%;
  background: radial-gradient(circle, #fff, var(--gold) 30%, var(--violet) 70%, transparent 100%);
  filter: blur(8px);
  animation: core-throb 1.2s ease-in-out infinite;
}
@keyframes core-throb {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.3); }
}
.portal-text {
  position: absolute;
  bottom: 18%;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--f-title);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.42em;
  color: var(--gold);
  text-shadow: 0 0 20px var(--gold-glow);
  animation: portal-text-pulse 1.4s ease-in-out infinite;
  white-space: nowrap;
}
@keyframes portal-text-pulse {
  0%, 100% { opacity: 1; text-shadow: 0 0 20px var(--gold-glow); }
  50%      { opacity: 0.7; text-shadow: 0 0 40px var(--gold-glow); }
}
.portal-flares {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.portal-flare {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 2px;
  height: 60%;
  background: linear-gradient(to top, transparent, var(--gold), transparent);
  transform-origin: 50% 0;
  transform: translate(-50%, -50%) rotate(var(--a));
  animation: flare-pulse 1.8s ease-in-out infinite;
  filter: blur(0.5px);
  box-shadow: 0 0 8px var(--gold-glow);
}
@keyframes flare-pulse {
  0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) rotate(var(--a)) scaleY(0.7); }
  50%      { opacity: 1; transform: translate(-50%, -50%) rotate(var(--a)) scaleY(1.1); }
}

/* ─── RESPONSIVE ─── */
@media (max-width: 1100px) {
  .auth-shell { grid-template-columns: 1fr 500px; }
  .float-card.fc-realm, .float-card.fc-news { display: none; }
  .float-card.fc-creed { display: none; }
}
@media (max-width: 880px) {
  .auth-shell { grid-template-columns: 1fr; grid-template-rows: 320px 1fr; }
  .scene { border-right: none; border-bottom: 1px solid var(--border-lo); }
  .world-mark { top: 6%; left: 50%; transform: translateX(-50%); text-align: center; }
  .wm-brand-row, .wm-divider { justify-content: center; }
  .char-stage { display: none; }
  .companion { display: none; }
}
</style>
